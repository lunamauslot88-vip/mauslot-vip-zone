<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020713">

<title>MAUSLOT VIP - 9.9 Claw Machine</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% -10%,#17477f 0%,#07172d 32%,#020610 68%,#010208 100%);
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 30%,rgba(28,126,255,.12),transparent 25%),
    radial-gradient(circle at 85% 55%,rgba(255,194,45,.10),transparent 25%);
}

.page{
  width:100%;
  max-width:470px;
  margin:auto;
  min-height:100vh;
  padding:12px 10px 28px;
  position:relative;
  z-index:2;
}

/* =========================
   LOGO
========================= */

.logo{
  text-align:center;
  padding:3px 0 6px;
}

.logo img{
  width:205px;
  max-width:70%;
  height:auto;
  object-fit:contain;
}

/* =========================
   TITLE
========================= */

.event-title{
  text-align:center;
  padding:2px 10px 11px;
}

.event-title .small{
  font-size:9px;
  letter-spacing:3px;
  color:#93a6bc;
  font-weight:700;
}

.event-title h1{
  margin:4px 0 2px;
  font-size:29px;
  line-height:1;
  color:#ffd96a;
  text-shadow:
    0 2px 0 #704804,
    0 0 17px rgba(255,205,61,.30);
}

.event-title p{
  margin:7px 0 0;
  font-size:9px;
  letter-spacing:1.4px;
  color:#d1d8e2;
}

/* =========================
   STATUS
========================= */

.status-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.status-card{
  padding:8px;
  text-align:center;
  border-radius:11px;
  border:1px solid #74591a;
  background:
    linear-gradient(180deg,#0b1c31,#06101d);
}

.status-card span{
  display:block;
  color:#8596aa;
  font-size:8px;
  letter-spacing:1px;
}

.status-card strong{
  display:block;
  margin-top:3px;
  color:#ffd65d;
  font-size:14px;
}

/* =========================
   MACHINE WRAPPER
========================= */

.machine-wrap{
  position:relative;
  width:100%;
  aspect-ratio:3 / 4.15;
  margin:auto;
}

/* GAMBAR MESIN 3D */

.machine-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:20;
  pointer-events:none;

  filter:
    drop-shadow(0 12px 25px rgba(0,0,0,.55))
    drop-shadow(0 0 12px rgba(255,196,47,.14));
}

/* =========================
   AREA KACA MESIN
========================= */

.glass-area{
  position:absolute;

  /*
  Posisi ini menyesuaikan gambar claw-machine.png
  */
  left:15.5%;
  right:15.5%;
  top:15.5%;
  bottom:31%;

  overflow:hidden;
  z-index:5;

  border-radius:12px;

  background:
    radial-gradient(circle at 50% 20%,rgba(27,112,220,.14),transparent 45%);
}

/* LIGHT REFLECTION */

.glass-area:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      110deg,
      transparent 0%,
      rgba(255,255,255,.05) 25%,
      transparent 43%
    );
  z-index:50;
}

/* =========================
   RAIL
========================= */

.rail{
  position:absolute;
  top:11%;
  left:7%;
  right:7%;
  height:4px;
  border-radius:10px;

  background:
    linear-gradient(90deg,#7c5308,#ffe16d,#805809);

  box-shadow:
    0 0 8px rgba(255,210,65,.65);

  z-index:7;
}

/* =========================
   CLAW 3D
========================= */

.claw{
  position:absolute;
  z-index:35;

  top:8%;
  left:50%;

  width:19%;

  transform:translateX(-50%);

  transition:
    left .28s ease,
    top .75s ease;

  pointer-events:none;
}

.claw img{
  display:block;
  width:100%;
  height:auto;

  filter:
    drop-shadow(0 5px 7px rgba(0,0,0,.48));
}

.claw.grabbing{
  top:49%;
}

.claw.lifting{
  top:8%;
}

.caught{
  position:absolute;

  width:54%;
  aspect-ratio:1/1;

  left:50%;
  bottom:-30%;

  transform:translateX(-50%);

  display:none;

  object-fit:contain;

  filter:
    drop-shadow(0 5px 7px rgba(0,0,0,.5));
}

.claw.has-prize .caught{
  display:block;
}

/* =========================
   PRIZE FLOOR
========================= */

.prize-floor{
  position:absolute;

  left:4%;
  right:4%;
  bottom:3%;

  height:43%;

  z-index:8;
}

/* =========================
   BALL/CAPSULE
========================= */

.ball{
  position:absolute;

  width:21%;
  aspect-ratio:1;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid rgba(255,255,255,.46);

  background:
    radial-gradient(
      circle at 32% 24%,
      rgba(255,255,255,.50),
      rgba(61,128,202,.14) 34%,
      rgba(6,13,25,.22) 68%
    );

  box-shadow:
    inset 0 0 13px rgba(255,255,255,.18),
    0 6px 12px rgba(0,0,0,.40);

  transition:
    opacity .3s,
    transform .3s,
    filter .3s;

  animation:float 3s ease-in-out infinite;
}

.ball img{
  width:78%;
  height:78%;
  object-fit:contain;

  filter:
    drop-shadow(0 3px 5px rgba(0,0,0,.35));

  pointer-events:none;
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }

  50%{
    transform:translateY(-4px) rotate(2deg);
  }
}

/* POSISI HADIAH */

.b1{
  left:0;
  bottom:0;
}

.b2{
  left:19%;
  bottom:29%;
  animation-delay:.4s;
}

.b3{
  left:39%;
  bottom:2%;
  animation-delay:.8s;
}

.b4{
  right:19%;
  bottom:30%;
  animation-delay:.3s;
}

.b5{
  right:0;
  bottom:2%;
  animation-delay:.9s;
}

/* GRAND PRIZE */

.b6{
  left:50%;
  bottom:57%;

  width:23%;

  transform:translateX(-50%);

  animation:none;

  background:
    radial-gradient(
      circle at 32% 24%,
      rgba(255,255,255,.80),
      rgba(255,199,45,.45) 34%,
      rgba(125,70,0,.28) 70%
    );

  box-shadow:
    0 0 20px rgba(255,198,42,.60),
    inset 0 0 14px rgba(255,255,255,.28);
}

.b7{
  left:4%;
  bottom:48%;
  width:18%;
  animation-delay:.6s;
}

.b8{
  right:4%;
  bottom:50%;
  width:18%;
  animation-delay:1.1s;
}

/* WINNER */

.ball.winner{
  border-color:#ffe474;

  filter:brightness(1.15);

  box-shadow:
    0 0 27px rgba(255,205,52,.95),
    inset 0 0 15px rgba(255,255,255,.38);
}

/* =========================
   CONTROLS
========================= */

.control-panel{
  margin-top:5px;

  padding:10px;

  border-radius:15px;

  border:1px solid #6c5518;

  background:
    linear-gradient(180deg,#0d1b2c,#060b12);

  box-shadow:
    0 8px 18px rgba(0,0,0,.3);
}

.controls{
  display:grid;
  grid-template-columns:65px 1fr 65px;
  gap:8px;
}

.btn{
  height:48px;

  border-radius:11px;

  border:1px solid #b18a22;

  background:#0d1c30;

  color:#ffd55d;

  font-size:19px;
  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;
}

.btn:active{
  transform:scale(.96);
}

.grab-btn{
  color:#07101a;

  font-size:14px;

  background:
    linear-gradient(
      180deg,
      #ffea82,
      #d5a126
    );

  border-color:#ffe276;

  box-shadow:
    0 0 13px rgba(255,200,49,.20);
}

.btn:disabled{
  opacity:.40;
}

/* =========================
   MESSAGE
========================= */

.message{
  min-height:40px;

  padding:9px 4px 0;

  text-align:center;

  color:#c4ccd7;

  font-size:10px;

  line-height:1.5;
}

/* =========================
   CLAIM
========================= */

.claim{
  display:none;

  width:100%;

  margin-top:7px;

  padding:12px 9px;

  text-align:center;

  text-decoration:none;

  border-radius:10px;

  color:#07101a;

  font-size:12px;
  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #855e09,
      #f6d25e,
      #8a620a
    );
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;

  z-index:9999;

  display:none;
  align-items:center;
  justify-content:center;

  padding:18px;

  background:
    rgba(0,0,0,.84);

  backdrop-filter:blur(5px);
}

.modal-box{
  width:100%;
  max-width:330px;

  text-align:center;

  padding:22px 17px 17px;

  border-radius:20px;

  border:2px solid #dbaa36;

  background:
    radial-gradient(circle at top,#163c6d,#07111f 58%);

  box-shadow:
    0 0 38px rgba(255,196,43,.25);
}

.reward-img{
  width:115px;
  height:115px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:1px solid #806319;

  background:
    radial-gradient(circle,#174278,#071426);

  box-shadow:
    0 0 25px rgba(255,201,50,.22);
}

.reward-img img{
  max-width:100px;
  max-height:100px;

  object-fit:contain;

  filter:
    drop-shadow(0 5px 7px rgba(0,0,0,.45));
}

.modal-small{
  margin-top:12px;

  font-size:8px;

  letter-spacing:2px;

  color:#8798ad;
}

.modal h2{
  margin:5px 0;

  color:#ffd55c;

  font-size:21px;
}

.reward-name{
  margin:10px 0 4px;

  color:#fff;

  font-size:18px;
  font-weight:900;
}

.reward-desc{
  color:#bdc7d4;

  font-size:10px;

  line-height:1.5;
}

.modal-claim{
  display:block;

  margin-top:14px;

  padding:12px;

  border-radius:9px;

  background:
    linear-gradient(
      90deg,
      #865f08,
      #f7d461,
      #865f08
    );

  color:#07101a;

  font-size:11px;
  font-weight:900;

  text-decoration:none;
}

.footer{
  text-align:center;

  padding:12px 5px 0;

  color:#607085;

  font-size:8px;

  line-height:1.5;
}

@media(max-width:370px){

  .event-title h1{
    font-size:25px;
  }

  .controls{
    grid-template-columns:58px 1fr 58px;
  }

}
</style>
</head>


<body>

<div class="page">

  <!-- LOGO -->
  <div class="logo">

    <img
      src="assets/logo-mauslot.png"
      alt="MAUSLOT">

  </div>


  <!-- TITLE -->
  <div class="event-title">

    <div class="small">
      EVENT SPECIAL
    </div>

    <h1>
      9.9 CLAW MACHINE
    </h1>

    <p>
      GRAB IT • WIN IT • CLAIM IT
    </p>

  </div>


  <!-- STATUS -->
  <div class="status-row">

    <div class="status-card">

      <span>
        TIKET BERMAIN
      </span>

      <strong id="ticket">
        1
      </strong>

    </div>


    <div class="status-card">

      <span>
        STATUS
      </span>

      <strong id="statusText">
        SIAP MAIN
      </strong>

    </div>

  </div>


  <!-- MACHINE -->

  <div class="machine-wrap">


    <!-- AREA DALAM KACA -->

    <div class="glass-area">


      <!-- RAIL -->

      <div class="rail"></div>


      <!-- CLAW -->

      <div
        class="claw"
        id="claw">

        <img
          id="clawImage"
          src="assets/claw-open.png"
          alt="Claw">


        <img
          class="caught"
          id="caughtPrize"
          src=""
          alt="Prize">

      </div>


      <!-- HADIAH -->

      <div class="prize-floor">


        <div
          class="ball b1"
          data-id="0">

          <img
            src="assets/coin.png"
            alt="Bonus Saldo">

        </div>


        <div
          class="ball b2"
          data-id="1">

          <img
            src="assets/gift.png"
            alt="VIP Gift">

        </div>


        <div
          class="ball b3"
          data-id="2">

          <img
            src="assets/diamond.png"
            alt="Diamond">

        </div>


        <div
          class="ball b4"
          data-id="3">

          <img
            src="assets/crown.png"
            alt="Crown">

        </div>


        <div
          class="ball b5"
          data-id="4">

          <img
            src="assets/chip.png"
            alt="VIP Point">

        </div>


        <div
          class="ball b6"
          data-id="5">

          <img
            src="assets/grand%20prize.png"
            alt="Grand Prize">

        </div>


        <div
          class="ball b7"
          data-id="6">

          <img
            src="assets/ticket.png"
            alt="VIP Ticket">

        </div>


        <div
          class="ball b8"
          data-id="7">

          <img
            src="assets/mystery.png"
            alt="Mystery">

        </div>


      </div>

    </div>


    <!-- FRAME MESIN 3D -->

    <img
      class="machine-img"
      src="assets/claw-machine.png"
      alt="MAUSLOT Claw Machine">

  </div>


  <!-- CONTROL -->

  <div class="control-panel">


    <div class="controls">


      <button
        class="btn"
        id="leftBtn"
        onclick="moveLeft()">

        ◀

      </button>


      <button
        class="btn grab-btn"
        id="grabBtn"
        onclick="playClaw()">

        🎯 GRAB

      </button>


      <button
        class="btn"
        id="rightBtn"
        onclick="moveRight()">

        ▶

      </button>


    </div>


    <div
      class="message"
      id="message">

      Gerakkan capit ke hadiah pilihan,
      lalu tekan <b>GRAB</b>.

    </div>


    <a
      href="https://mauslot.life/"
      class="claim"
      id="claimButton">

      🎁 CLAIM HADIAH

    </a>


  </div>


  <div class="footer">

    MAUSLOT VIP • EVENT SPECIAL 9.9

  </div>


</div>



<!-- RESULT MODAL -->

<div
  class="modal"
  id="rewardModal">


  <div class="modal-box">


    <div class="reward-img">

      <img
        id="rewardImage"
        src="assets/gift.png"
        alt="Reward">

    </div>


    <div class="modal-small">

      MAUSLOT 9.9 CLAW MACHINE

    </div>


    <h2>
      SELAMAT!
    </h2>


    <div
      class="reward-name"
      id="rewardName">

      VIP REWARD

    </div>


    <div
      class="reward-desc"
      id="rewardDescription">

      Hadiah berhasil didapatkan.

    </div>


    <a
      href="https://mauslot.life/"
      class="modal-claim">

      🎁 CLAIM HADIAH

    </a>


  </div>

</div>


<script>

/* ================================
   HADIAH
================================ */

const prizes = [

  {
    name:"BONUS SALDO",
    image:"assets/coin.png",
    description:"Bonus saldo spesial Event 9.9.",
    position:14
  },

  {
    name:"VIP GIFT",
    image:"assets/gift.png",
    description:"Hadiah eksklusif khusus member VIP.",
    position:29
  },

  {
    name:"DIAMOND REWARD",
    image:"assets/diamond.png",
    description:"Diamond Reward spesial MAUSLOT.",
    position:43
  },

  {
    name:"CROWN REWARD",
    image:"assets/crown.png",
    description:"Reward premium khusus Event 9.9.",
    position:59
  },

  {
    name:"VIP POINT",
    image:"assets/chip.png",
    description:"VIP Point berhasil didapatkan.",
    position:78
  },

  {
    name:"GRAND PRIZE",
    image:"assets/grand%20prize.png",
    description:"Grand Prize spesial MAUSLOT 9.9.",
    position:50
  },

  {
    name:"VIP TICKET",
    image:"assets/ticket.png",
    description:"VIP Ticket spesial berhasil didapatkan.",
    position:20
  },

  {
    name:"MYSTERY REWARD",
    image:"assets/mystery.png",
    description:"Mystery Reward berhasil didapatkan.",
    position:84
  }

];


/* ================================
   STATE
================================ */

let ticket = 1;

let clawPosition = 50;

let playing = false;


/* ================================
   ELEMENT
================================ */

const claw =
document.getElementById("claw");

const clawImage =
document.getElementById("clawImage");

const caughtPrize =
document.getElementById("caughtPrize");

const ticketEl =
document.getElementById("ticket");

const statusText =
document.getElementById("statusText");

const message =
document.getElementById("message");

const leftBtn =
document.getElementById("leftBtn");

const rightBtn =
document.getElementById("rightBtn");

const grabBtn =
document.getElementById("grabBtn");


/* ================================
   LEFT
================================ */

function moveLeft(){

  if(playing){
    return;
  }

  clawPosition -= 8;


  if(clawPosition < 12){

    clawPosition = 12;

  }


  updateClaw();

}


/* ================================
   RIGHT
================================ */

function moveRight(){

  if(playing){
    return;
  }


  clawPosition += 8;


  if(clawPosition > 88){

    clawPosition = 88;

  }


  updateClaw();

}


/* ================================
   UPDATE
================================ */

function updateClaw(){

  claw.style.left =
  clawPosition + "%";

}


/* ================================
   CONTROLS
================================ */

function disableControls(){

  leftBtn.disabled = true;

  rightBtn.disabled = true;

  grabBtn.disabled = true;

}


function enableControls(){

  leftBtn.disabled = false;

  rightBtn.disabled = false;

  grabBtn.disabled = false;

}


/* ================================
   PILIH HADIAH TERDEKAT
================================ */

function getClosestPrize(){

  let selected = 0;

  let smallest = 999;


  prizes.forEach(
    (prize,index)=>{


      const distance =
      Math.abs(
        prize.position -
        clawPosition
      );


      if(
        distance < smallest
      ){

        smallest =
        distance;

        selected =
        index;

      }

    }
  );


  return selected;

}


/* ================================
   PLAY
================================ */

async function playClaw(){

  if(playing){
    return;
  }


  if(ticket <= 0){

    message.innerHTML =
    "Tiket bermain sudah habis.";

    return;

  }


  playing = true;


  disableControls();


  statusText.innerHTML =
  "MEMILIH...";


  message.innerHTML =
  "Capit sedang menuju hadiah...";


  const winnerIndex =
  getClosestPrize();


  const winner =
  prizes[winnerIndex];


  /* PINDAH KE HADIAH */

  clawPosition =
  winner.position;


  updateClaw();


  await wait(500);


  /* TURUN */

  statusText.innerHTML =
  "GRABBING";


  claw.classList.add(
    "grabbing"
  );


  await wait(850);


  /* TUTUP CAPIT */

  clawImage.src =
  "assets/claw-close.png";


  highlightPrize(
    winnerIndex
  );


  await wait(450);


  /* HADIAH MASUK CAPIT */

  caughtPrize.src =
  winner.image;


  claw.classList.add(
    "has-prize"
  );


  const winnerElement =
  document.querySelector(
    `.ball[data-id="${winnerIndex}"]`
  );


  if(winnerElement){

    winnerElement.style.opacity =
    "0";

  }


  await wait(350);


  /* NAIK */

  claw.classList.remove(
    "grabbing"
  );


  claw.classList.add(
    "lifting"
  );


  statusText.innerHTML =
  "MENGANGKAT...";


  await wait(900);


  /* TIKET */

  ticket--;


  ticketEl.innerHTML =
  ticket;


  /* RESULT */

  showReward(
    winner
  );


  statusText.innerHTML =
  "BERHASIL";


  message.innerHTML =
  "🎉 Hadiah berhasil didapatkan. Silakan lanjutkan claim.";


  document.getElementById(
    "claimButton"
  ).style.display =
  "block";


  playing = false;

}


/* ================================
   HIGHLIGHT
================================ */

function highlightPrize(index){

  document
  .querySelectorAll(".ball")
  .forEach(
    element=>{

      element.classList.remove(
        "winner"
      );

    }
  );


  const element =
  document.querySelector(
    `.ball[data-id="${index}"]`
  );


  if(element){

    element.classList.add(
      "winner"
    );

  }

}


/* ================================
   RESULT
================================ */

function showReward(prize){

  document.getElementById(
    "rewardImage"
  ).src =
  prize.image;


  document.getElementById(
    "rewardName"
  ).innerHTML =
  prize.name;


  document.getElementById(
    "rewardDescription"
  ).innerHTML =
  prize.description;


  document.getElementById(
    "rewardModal"
  ).style.display =
  "flex";

}


/* ================================
   WAIT
================================ */

function wait(ms){

  return new Promise(
    resolve=>
    setTimeout(
      resolve,
      ms
    )
  );

}


/* ================================
   CLOSE MODAL
================================ */

document
.getElementById(
  "rewardModal"
)
.addEventListener(
  "click",
  function(event){

    if(
      event.target === this
    ){

      this.style.display =
      "none";

    }

  }
);


/* ================================
   KEYBOARD
================================ */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "ArrowLeft"
    ){

      moveLeft();

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      moveRight();

    }


    if(
      event.key ===
      "Enter" ||
      event.key === " "
    ){

      playClaw();

    }

  }
);

</script>

</body>
</html>
