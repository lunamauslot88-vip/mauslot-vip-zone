<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020713">

<title>MAUSLOT 9.9 Claw Machine</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  position:relative;
  overflow-x:hidden;

  background:
    radial-gradient(circle at 50% 0%,#143e72 0%,#071528 38%,#020610 72%,#010308 100%);
}

/* =====================================
   ANIMATED BACKGROUND
===================================== */

.bg-scene{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 20%,rgba(24,90,166,.14),transparent 38%),
    radial-gradient(circle at 50% 100%,rgba(255,192,52,.07),transparent 38%);
}

.bg-glow{
  position:absolute;

  width:380px;
  height:380px;

  border-radius:50%;

  filter:blur(75px);

  opacity:.40;

  animation:
    bgPulse 6s ease-in-out infinite;
}

.glow-left{
  left:-160px;
  top:110px;

  background:
    radial-gradient(
      circle,
      rgba(40,140,255,.38),
      rgba(17,64,145,.16) 48%,
      transparent 75%
    );
}

.glow-right{
  right:-160px;
  top:150px;

  background:
    radial-gradient(
      circle,
      rgba(255,199,65,.30),
      rgba(176,117,14,.15) 48%,
      transparent 75%
    );

  animation-delay:2s;
}

/* LIGHT BEAM */

.light-beam{
  position:absolute;

  top:-12%;

  width:180px;
  height:125%;

  opacity:.08;

  filter:blur(5px);

  background:
    linear-gradient(
      180deg,
      transparent 0%,
      rgba(125,198,255,.30) 22%,
      rgba(255,255,255,.04) 52%,
      rgba(255,209,84,.22) 82%,
      transparent 100%
    );

  animation:
    beamMove 8s ease-in-out infinite;
}

.beam-1{
  left:5%;

  transform:
    rotate(12deg);
}

.beam-2{
  right:5%;

  transform:
    rotate(-12deg);

  animation-delay:3s;
}

/* FLOATING ORB */

.floating-orb{
  position:absolute;

  border-radius:50%;

  opacity:.18;

  filter:blur(1px);

  animation:
    floatOrb 7s ease-in-out infinite;
}

.orb-1{
  width:48px;
  height:48px;

  left:7%;
  top:24%;

  background:
    radial-gradient(
      circle at 35% 35%,
      #fff6ba 0%,
      #ffc844 34%,
      #174689 100%
    );
}

.orb-2{
  width:30px;
  height:30px;

  left:13%;
  bottom:17%;

  background:
    radial-gradient(
      circle at 35% 35%,
      #fff 0%,
      #74bfff 38%,
      #133d80 100%
    );

  animation-delay:1.3s;
}

.orb-3{
  width:53px;
  height:53px;

  right:7%;
  top:29%;

  background:
    radial-gradient(
      circle at 35% 35%,
      #fff6bd 0%,
      #ffcd53 36%,
      #153f81 100%
    );

  animation-delay:2.2s;
}

.orb-4{
  width:34px;
  height:34px;

  right:11%;
  bottom:20%;

  background:
    radial-gradient(
      circle at 35% 35%,
      #fff 0%,
      #79bfff 36%,
      #11366d 100%
    );

  animation-delay:3.1s;
}

/* SPARK */

.spark{
  position:absolute;

  width:6px;
  height:6px;

  border-radius:50%;

  background:#9fd5ff;

  box-shadow:
    0 0 8px rgba(128,202,255,.8),
    0 0 16px rgba(128,202,255,.45);

  opacity:.75;

  animation:
    sparkle 3s ease-in-out infinite;
}

.spark-1{
  left:9%;
  top:14%;
}

.spark-2{
  left:14%;
  top:48%;
  animation-delay:.8s;
}

.spark-3{
  left:10%;
  bottom:15%;
  animation-delay:1.7s;
}

.spark-4{
  right:9%;
  top:17%;
  animation-delay:.4s;
}

.spark-5{
  right:15%;
  top:53%;
  animation-delay:1.5s;
}

.spark-6{
  right:11%;
  bottom:14%;
  animation-delay:2.3s;
}

/* BACKGROUND ANIMATION */

@keyframes bgPulse{

  0%,100%{
    transform:scale(1);
    opacity:.30;
  }

  50%{
    transform:scale(1.08);
    opacity:.50;
  }

}

@keyframes beamMove{

  0%,100%{
    translate:0 -28px;
    opacity:.05;
  }

  50%{
    translate:0 26px;
    opacity:.13;
  }

}

@keyframes floatOrb{

  0%,100%{
    transform:
      translateY(0)
      translateX(0);
  }

  50%{
    transform:
      translateY(-16px)
      translateX(6px);
  }

}

@keyframes sparkle{

  0%,100%{
    transform:scale(.75);
    opacity:.20;
  }

  50%{
    transform:scale(1.55);
    opacity:1;
  }

}

/* =====================================
   PAGE
===================================== */

.page{
  width:100%;
  max-width:470px;

  margin:0 auto;

  padding:12px 10px 30px;

  position:relative;

  z-index:2;
}

/* =====================================
   HEADER
===================================== */

.logo{
  text-align:center;

  margin-bottom:5px;
}

.logo img{
  width:205px;

  max-width:70%;

  height:auto;

  filter:
    drop-shadow(
      0 4px 10px rgba(0,0,0,.35)
    );
}

.title{
  text-align:center;

  margin-bottom:10px;
}

.title small{
  display:block;

  color:#91a4ba;

  font-size:9px;

  letter-spacing:3px;

  font-weight:bold;
}

.title h1{
  margin:4px 0;

  color:#ffd563;

  font-size:29px;

  line-height:1;

  text-shadow:
    0 2px 0 #714a04,
    0 0 16px rgba(255,202,50,.35);
}

.title p{
  margin:6px 0 0;

  color:#ccd5e0;

  font-size:9px;

  letter-spacing:1.4px;
}

/* =====================================
   STATUS
===================================== */

.status-row{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-bottom:10px;
}

.status-box{
  padding:8px;

  text-align:center;

  border-radius:10px;

  border:
    1px solid #765b19;

  background:
    linear-gradient(
      180deg,
      rgba(10,28,50,.95),
      rgba(4,13,25,.95)
    );

  box-shadow:
    inset 0 0 14px rgba(255,204,62,.035),
    0 6px 15px rgba(0,0,0,.18);
}

.status-box span{
  display:block;

  font-size:8px;

  color:#8292a6;

  letter-spacing:1px;
}

.status-box strong{
  display:block;

  margin-top:3px;

  color:#ffd75d;

  font-size:14px;
}

/* =====================================
   MACHINE
===================================== */

.machine-wrap{
  position:relative;

  width:100%;

  aspect-ratio:
    3 / 4.05;

  filter:
    drop-shadow(
      0 0 24px rgba(71,158,255,.10)
    );
}

.machine-frame{
  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:contain;

  z-index:1;

  pointer-events:none;

  filter:
    drop-shadow(
      0 15px 25px rgba(0,0,0,.55)
    );
}

/* =====================================
   GAME GLASS
===================================== */

.game-glass{
  position:absolute;

  left:15.4%;
  right:15.4%;

  top:15.7%;
  bottom:34.1%;

  z-index:5;

  overflow:hidden;

  border-radius:10px;

  background:
    radial-gradient(
      circle at 50% 24%,
      #0d457e 0%,
      #082d55 35%,
      #051d38 68%,
      #031325 100%
    );

  box-shadow:
    inset 0 0 25px rgba(0,139,255,.32),
    inset 0 -35px 55px rgba(0,0,0,.35);
}

.game-glass:after{
  content:"";

  position:absolute;

  inset:0;

  z-index:60;

  pointer-events:none;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,.06),
      transparent 28%,
      transparent 72%,
      rgba(255,255,255,.025)
    );
}

/* =====================================
   LIGHT INSIDE MACHINE
===================================== */

.lights{
  position:absolute;

  top:4.5%;

  left:12%;
  right:12%;

  display:flex;

  justify-content:space-between;

  z-index:8;
}

.light{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#55b8ff;

  box-shadow:
    0 0 8px #42a8ff,
    0 0 14px #278eff;

  animation:
    lightBlink 1.4s ease-in-out infinite;
}

.light:nth-child(2){
  animation-delay:.4s;
}

.light:nth-child(3){
  animation-delay:.8s;
}

@keyframes lightBlink{

  0%,100%{
    opacity:.55;
  }

  50%{
    opacity:1;
  }

}

/* =====================================
   RAIL
===================================== */

.rail{
  position:absolute;

  top:9%;

  left:7%;
  right:7%;

  height:6px;

  border-radius:20px;

  z-index:10;

  background:
    linear-gradient(
      180deg,
      #ffe178,
      #bc7f13
    );

  box-shadow:
    0 0 10px rgba(255,210,65,.55);
}

/* =====================================
   CLAW SYSTEM
===================================== */

.claw-system{
  position:absolute;

  left:50%;

  top:5.5%;

  width:110px;

  transform:
    translateX(-50%);

  z-index:40;

  transition:
    left .28s ease;

  pointer-events:none;
}

.carriage{
  width:42px;
  height:23px;

  margin:0 auto;

  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      #ffe57a,
      #a46d0d
    );

  border:
    2px solid #ffe783;

  box-shadow:
    0 0 8px rgba(255,208,54,.45);
}

.cable{
  width:4px;

  height:42px;

  margin:0 auto;

  background:
    linear-gradient(
      90deg,
      #383838,
      #d5d5d5,
      #474747
    );

  transition:
    height .75s cubic-bezier(.4,0,.2,1);
}

.claw-holder{
  width:100px;

  margin:0 auto;

  position:relative;
}

.claw-img{
  display:block;

  width:100%;

  height:auto;

  object-fit:contain;

  filter:
    drop-shadow(
      0 6px 8px rgba(0,0,0,.55)
    );
}

/* CAUGHT PRIZE */

.caught{
  position:absolute;

  left:50%;

  bottom:-28px;

  transform:
    translateX(-50%);

  width:48px;
  height:48px;

  object-fit:contain;

  display:none;

  filter:
    drop-shadow(
      0 5px 7px rgba(0,0,0,.55)
    );
}

.claw-holder.has-prize .caught{
  display:block;
}

/* =====================================
   PRIZE FLOOR
===================================== */

.prize-floor{
  position:absolute;

  left:4%;
  right:4%;

  bottom:.5%;

  height:32%;

  z-index:20;
}

/* =====================================
   BALL
===================================== */

.ball{
  position:absolute;

  width:21%;

  aspect-ratio:1;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  border:
    1.5px solid rgba(255,255,255,.38);

  background:
    radial-gradient(
      circle at 30% 22%,
      rgba(255,255,255,.55),
      rgba(57,128,205,.15) 34%,
      rgba(4,13,26,.18) 70%
    );

  box-shadow:
    inset 0 0 15px rgba(255,255,255,.16),
    0 7px 14px rgba(0,0,0,.42);

  animation:
    floatBall 3s ease-in-out infinite;

  transition:
    opacity .3s,
    filter .3s;
}

.ball img{
  width:78%;

  height:78%;

  object-fit:contain;

  pointer-events:none;

  filter:
    drop-shadow(
      0 3px 5px rgba(0,0,0,.35)
    );
}

@keyframes floatBall{

  0%,100%{
    transform:
      translateY(0);
  }

  50%{
    transform:
      translateY(-3px);
  }

}

/* BALL POSITION */

.b1{
  left:0;
  bottom:0;
}

.b2{
  left:20%;
  bottom:17%;
}

.b3{
  left:40%;
  bottom:0;
}

.b4{
  right:20%;
  bottom:18%;
}

.b5{
  right:0;
  bottom:0;
}

.b6{
  left:50%;

  bottom:40%;

  width:23%;

  transform:
    translateX(-50%);

  animation:none;

  background:
    radial-gradient(
      circle at 32% 22%,
      #fff3ad,
      rgba(255,194,39,.5) 40%,
      rgba(125,71,0,.27) 75%
    );

  box-shadow:
    0 0 26px rgba(255,198,39,.7),
    inset 0 0 15px rgba(255,255,255,.32);
}

.b7{
  left:4%;

  bottom:31%;

  width:18%;
}

.b8{
  right:4%;

  bottom:31%;

  width:18%;
}

.ball.winner{
  filter:
    brightness(1.25);

  border-color:#ffe66f;

  box-shadow:
    0 0 32px rgba(255,205,50,1),
    inset 0 0 16px rgba(255,255,255,.4);
}

/* =====================================
   CONTROL
===================================== */

.control{
  margin-top:8px;

  padding:10px;

  border-radius:15px;

  border:
    1px solid #705719;

  background:
    linear-gradient(
      180deg,
      rgba(12,29,49,.98),
      rgba(4,10,18,.98)
    );

  box-shadow:
    0 10px 28px rgba(0,0,0,.35),
    0 0 18px rgba(255,199,72,.08);
}

.buttons{
  display:grid;

  grid-template-columns:
    68px 1fr 68px;

  gap:8px;
}

button{
  height:49px;

  border-radius:11px;

  border:
    1px solid #b58b21;

  background:
    linear-gradient(
      180deg,
      #10233d,
      #071426
    );

  color:#ffd55b;

  font-size:20px;

  font-weight:bold;

  cursor:pointer;

  touch-action:manipulation;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05);
}

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.4;
}

.grab{
  font-size:14px;

  color:#07101a;

  background:
    linear-gradient(
      180deg,
      #fff09b 0%,
      #f4cd55 45%,
      #c88e17 100%
    );

  box-shadow:
    0 0 10px rgba(255,206,63,.25),
    inset 0 1px 0 rgba(255,255,255,.55);

  animation:
    grabGlow 2.2s ease-in-out infinite;
}

@keyframes grabGlow{

  0%,100%{
    box-shadow:
      0 0 8px rgba(255,204,55,.20),
      inset 0 1px 0 rgba(255,255,255,.55);
  }

  50%{
    box-shadow:
      0 0 20px rgba(255,204,55,.45),
      inset 0 1px 0 rgba(255,255,255,.65);
  }

}

.message{
  min-height:40px;

  padding-top:9px;

  text-align:center;

  font-size:10px;

  line-height:1.5;

  color:#c4ccd7;
}

/* =====================================
   CLAIM
===================================== */

.claim{
  display:none;

  margin-top:8px;

  padding:12px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #875f08,
      #f6d25f,
      #875f08
    );

  text-align:center;

  text-decoration:none;

  color:#07101a;

  font-size:12px;

  font-weight:bold;

  box-shadow:
    0 5px 15px rgba(255,196,40,.18);
}

/* =====================================
   MODAL
===================================== */

.modal{
  position:fixed;

  inset:0;

  z-index:9999;

  display:none;

  align-items:center;

  justify-content:center;

  padding:18px;

  background:
    rgba(0,0,0,.85);

  backdrop-filter:
    blur(5px);
}

.modal-box{
  width:100%;

  max-width:330px;

  padding:
    22px 17px 17px;

  text-align:center;

  border-radius:20px;

  border:
    2px solid #d7aa34;

  background:
    radial-gradient(
      circle at top,
      #173e70,
      #07111f 60%
    );

  box-shadow:
    0 0 38px rgba(255,196,43,.25);
}

.reward-image{
  width:115px;
  height:115px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:#0a2340;

  border:
    1px solid #84671a;

  box-shadow:
    0 0 24px rgba(255,201,55,.15);
}

.reward-image img{
  width:100px;

  height:100px;

  object-fit:contain;
}

.modal h2{
  color:#ffd65d;

  margin:10px 0 5px;
}

.reward-name{
  font-size:18px;

  font-weight:bold;

  margin:9px 0 5px;
}

.reward-desc{
  font-size:10px;

  line-height:1.5;

  color:#bdc7d4;
}

.modal-claim{
  display:block;

  margin-top:14px;

  padding:12px;

  border-radius:9px;

  text-decoration:none;

  font-size:11px;

  font-weight:bold;

  color:#07101a;

  background:
    linear-gradient(
      90deg,
      #875f08,
      #f7d35e,
      #875f08
    );
}

.footer{
  text-align:center;

  padding-top:12px;

  color:#607085;

  font-size:8px;
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:370px){

  .title h1{
    font-size:25px;
  }

  .buttons{
    grid-template-columns:
      58px 1fr 58px;
  }

  .claw-system{
    width:100px;
  }

  .bg-glow{
    width:280px;
    height:280px;
  }

}
</style>
</head>


<body>

<!-- =====================================
     ANIMATED BACKGROUND
===================================== -->

<div class="bg-scene">

  <div class="bg-glow glow-left"></div>
  <div class="bg-glow glow-right"></div>

  <div class="light-beam beam-1"></div>
  <div class="light-beam beam-2"></div>

  <div class="floating-orb orb-1"></div>
  <div class="floating-orb orb-2"></div>
  <div class="floating-orb orb-3"></div>
  <div class="floating-orb orb-4"></div>

  <div class="spark spark-1"></div>
  <div class="spark spark-2"></div>
  <div class="spark spark-3"></div>
  <div class="spark spark-4"></div>
  <div class="spark spark-5"></div>
  <div class="spark spark-6"></div>

</div>


<!-- =====================================
     PAGE
===================================== -->

<div class="page">

  <!-- LOGO -->

  <div class="logo">

    <img
      src="assets/logo-mauslot.png"
      alt="MAUSLOT">

  </div>


  <!-- TITLE -->

  <div class="title">

    <small>
      EVENT SPECIAL
    </small>

    <h1>
      9.9 CLAW MACHINE
    </h1>

    <p>
      GRAB IT • WIN IT • CLAIM IT
    </p>

  </div>


  <!-- STATUS -->

  <div class="status-row">

    <div class="status-box">

      <span>
        TIKET BERMAIN
      </span>

      <strong id="ticket">
        1
      </strong>

    </div>


    <div class="status-box">

      <span>
        STATUS
      </span>

      <strong id="status">
        SIAP MAIN
      </strong>

    </div>

  </div>


  <!-- =====================================
       MACHINE
  ===================================== -->

  <div class="machine-wrap">

    <img
      class="machine-frame"
      src="assets/claw%20machine.png"
      alt="">


    <div
      class="game-glass"
      id="gameGlass">


      <!-- LIGHT -->

      <div class="lights">

        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>

      </div>


      <!-- RAIL -->

      <div class="rail"></div>


      <!-- CLAW -->

      <div
        class="claw-system"
        id="clawSystem">


        <div class="carriage"></div>


        <div
          class="cable"
          id="cable">
        </div>


        <div
          class="claw-holder"
          id="clawHolder">


          <img
            class="claw-img"
            id="clawImage"
            src="assets/claw%20open.png"
            alt="">


          <img
            class="caught"
            id="caughtPrize"
            src=""
            alt="">


        </div>


      </div>


      <!-- PRIZES -->

      <div class="prize-floor">


        <div
          class="ball b1"
          data-id="0">

          <img
            src="assets/coin.png">

        </div>


        <div
          class="ball b2"
          data-id="1">

          <img
            src="assets/gift.png">

        </div>


        <div
          class="ball b3"
          data-id="2">

          <img
            src="assets/diamond.png">

        </div>


        <div
          class="ball b4"
          data-id="3">

          <img
            src="assets/crown.png">

        </div>


        <div
          class="ball b5"
          data-id="4">

          <img
            src="assets/chip.png">

        </div>


        <div
          class="ball b6"
          data-id="5">

          <img
            src="assets/grand%20prize.png">

        </div>


        <div
          class="ball b7"
          data-id="6">

          <img
            src="assets/ticket.png">

        </div>


        <div
          class="ball b8"
          data-id="7">

          <img
            src="assets/mystery.png">

        </div>


      </div>


    </div>


  </div>


  <!-- =====================================
       CONTROLS
  ===================================== -->

  <div class="control">


    <div class="buttons">


      <button
        id="leftButton"
        onclick="moveLeft()">

        ◀

      </button>


      <button
        class="grab"
        id="grabButton"
        onclick="grabPrize()">

        🎯 GRAB

      </button>


      <button
        id="rightButton"
        onclick="moveRight()">

        ▶

      </button>


    </div>


    <div
      class="message"
      id="message">

      Gerakkan capit ke hadiah pilihan lalu tekan
      <b>GRAB</b>.

    </div>


    <a
      href="https://mauslot.life/"
      id="claimButton"
      class="claim">

      🎁 CLAIM HADIAH

    </a>


  </div>


  <div class="footer">

    MAUSLOT VIP • EVENT SPECIAL 9.9

  </div>


</div>



<!-- =====================================
     RESULT MODAL
===================================== -->

<div
  class="modal"
  id="modal">


  <div class="modal-box">


    <div class="reward-image">

      <img
        id="resultImage"
        src="assets/gift.png">

    </div>


    <h2>
      SELAMAT!
    </h2>


    <div
      class="reward-name"
      id="resultName">

      VIP REWARD

    </div>


    <div
      class="reward-desc"
      id="resultDesc">

      Hadiah berhasil didapatkan.

    </div>


    <a
      href="https://mauslot.life/"
      class="modal-claim">

      🎁 CLAIM HADIAH

    </a>


  </div>

</div>



<script>

/* =====================================
   DATA HADIAH
===================================== */

const prizes = [

  {
    name:"BONUS SALDO",
    image:"assets/coin.png",
    description:"Bonus saldo spesial Event 9.9."
  },

  {
    name:"VIP GIFT",
    image:"assets/gift.png",
    description:"Hadiah VIP spesial berhasil didapatkan."
  },

  {
    name:"DIAMOND REWARD",
    image:"assets/diamond.png",
    description:"Diamond Reward spesial MAUSLOT."
  },

  {
    name:"CROWN REWARD",
    image:"assets/crown.png",
    description:"Crown Reward spesial Event 9.9."
  },

  {
    name:"VIP POINT",
    image:"assets/chip.png",
    description:"Tambahan VIP Point berhasil didapatkan."
  },

  {
    name:"GRAND PRIZE",
    image:"assets/grand%20prize.png",
    description:"Grand Prize spesial MAUSLOT 9.9."
  },

  {
    name:"VIP TICKET",
    image:"assets/ticket.png",
    description:"VIP Ticket berhasil didapatkan."
  },

  {
    name:"MYSTERY REWARD",
    image:"assets/mystery.png",
    description:"Mystery Reward berhasil didapatkan."
  }

];


/* =====================================
   STATE
===================================== */

let ticket = 1;

let position = 50;

let playing = false;


/* =====================================
   ELEMENTS
===================================== */

const gameGlass =
document.getElementById(
  "gameGlass"
);

const clawSystem =
document.getElementById(
  "clawSystem"
);

const cable =
document.getElementById(
  "cable"
);

const clawHolder =
document.getElementById(
  "clawHolder"
);

const clawImage =
document.getElementById(
  "clawImage"
);

const caughtPrize =
document.getElementById(
  "caughtPrize"
);

const statusText =
document.getElementById(
  "status"
);

const ticketText =
document.getElementById(
  "ticket"
);

const message =
document.getElementById(
  "message"
);

const leftButton =
document.getElementById(
  "leftButton"
);

const rightButton =
document.getElementById(
  "rightButton"
);

const grabButton =
document.getElementById(
  "grabButton"
);


/* =====================================
   POSITION
===================================== */

function updatePosition(){

  clawSystem.style.left =
  position + "%";

}


/* =====================================
   LEFT
===================================== */

function moveLeft(){

  if(playing){
    return;
  }


  position -= 8;


  if(position < 12){

    position = 12;

  }


  updatePosition();


  message.innerHTML =
  "Capit bergerak ke kiri.";

}


/* =====================================
   RIGHT
===================================== */

function moveRight(){

  if(playing){
    return;
  }


  position += 8;


  if(position > 88){

    position = 88;

  }


  updatePosition();


  message.innerHTML =
  "Capit bergerak ke kanan.";

}


/* =====================================
   GET CENTER OF PRIZE
===================================== */

function getPrizeCenter(
  element
){

  const glassRect =
  gameGlass.getBoundingClientRect();


  const prizeRect =
  element.getBoundingClientRect();


  return {

    x:
      (
        prizeRect.left -
        glassRect.left
      )
      +
      (
        prizeRect.width / 2
      ),

    y:
      (
        prizeRect.top -
        glassRect.top
      )
      +
      (
        prizeRect.height / 2
      )

  };

}


/* =====================================
   FIND CLOSEST PRIZE
===================================== */

function findClosestPrize(){

  const balls =
  document.querySelectorAll(
    ".ball"
  );


  const glassRect =
  gameGlass.getBoundingClientRect();


  const targetX =
  glassRect.width *
  (
    position / 100
  );


  let winner = 0;

  let smallestDistance =
  Infinity;


  balls.forEach(
    (ball,index)=>{


      if(
        ball.style.opacity ===
        "0"
      ){
        return;
      }


      const center =
      getPrizeCenter(
        ball
      );


      const distance =
      Math.abs(
        center.x -
        targetX
      );


      if(
        distance <
        smallestDistance
      ){

        smallestDistance =
        distance;

        winner =
        index;

      }

    }
  );


  return winner;

}


/* =====================================
   MOVE CLAW EXACTLY TO PRIZE
===================================== */

function moveToPrize(
  prizeElement
){

  const glassRect =
  gameGlass.getBoundingClientRect();


  const center =
  getPrizeCenter(
    prizeElement
  );


  const percentage =
  (
    center.x /
    glassRect.width
  ) * 100;


  position =
  Math.max(
    12,
    Math.min(
      88,
      percentage
    )
  );


  updatePosition();

}


/* =====================================
   AUTO DROP CALCULATION
===================================== */

function calculateDrop(
  prizeElement
){

  const glassRect =
  gameGlass.getBoundingClientRect();


  const prizeRect =
  prizeElement.getBoundingClientRect();


  const clawRect =
  clawImage.getBoundingClientRect();


  /*
  CENTER OF PRIZE
  */

  const prizeCenterY =
  (
    prizeRect.top -
    glassRect.top
  )
  +
  (
    prizeRect.height / 2
  );


  /*
  CURRENT CLAW BOTTOM
  */

  const clawBottom =
  clawRect.bottom -
  glassRect.top;


  /*
  TARGET CLAW POSITION
  CLAW DIBUAT MASUK SEDIKIT
  KE AREA BOLA
  */

  const targetY =
  prizeCenterY -
  (
    prizeRect.height *
    .10
  );


  let additionalDrop =
  targetY -
  clawBottom;


  if(
    additionalDrop < 0
  ){

    additionalDrop = 0;

  }


  /*
  BATAS MAKSIMUM
  */

  const maxDrop =
  glassRect.height *
  .60;


  if(
    additionalDrop >
    maxDrop
  ){

    additionalDrop =
    maxDrop;

  }


  return 42 +
  additionalDrop;

}


/* =====================================
   LOCK
===================================== */

function lockControls(){

  leftButton.disabled = true;

  rightButton.disabled = true;

  grabButton.disabled = true;

}


function unlockControls(){

  leftButton.disabled = false;

  rightButton.disabled = false;

  grabButton.disabled = false;

}


/* =====================================
   GRAB
===================================== */

async function grabPrize(){

  if(playing){
    return;
  }


  if(ticket <= 0){

    message.innerHTML =
    "Tiket bermain sudah habis.";

    return;

  }


  playing = true;


  lockControls();


  /*
  RESET CLAW OPEN
  */

  clawImage.src =
  "assets/claw%20open.png";


  clawHolder.classList.remove(
    "has-prize"
  );


  caughtPrize.src = "";


  /*
  PILIH HADIAH TERDEKAT
  */

  const winnerIndex =
  findClosestPrize();


  const prize =
  prizes[winnerIndex];


  const prizeElement =
  document.querySelector(
    `.ball[data-id="${winnerIndex}"]`
  );


  /*
  MOVE X
  */

  statusText.innerHTML =
  "MENUJU HADIAH";


  message.innerHTML =
  "Capit sedang menuju hadiah...";


  moveToPrize(
    prizeElement
  );


  await wait(500);


  /*
  CALCULATE Y
  */

  const dropHeight =
  calculateDrop(
    prizeElement
  );


  /*
  DROP
  */

  statusText.innerHTML =
  "GRABBING";


  message.innerHTML =
  "Capit sedang turun...";


  cable.style.height =
  dropHeight + "px";


  await wait(800);


  /*
  CLOSE
  */

  clawImage.src =
  "assets/claw%20close.png";


  prizeElement.classList.add(
    "winner"
  );


  await wait(350);


  /*
  CATCH PRIZE
  */

  caughtPrize.src =
  prize.image;


  clawHolder.classList.add(
    "has-prize"
  );


  prizeElement.style.opacity =
  "0";


  await wait(350);


  /*
  LIFT
  */

  statusText.innerHTML =
  "MENGANGKAT";


  message.innerHTML =
  "Hadiah berhasil tercapit...";


  cable.style.height =
  "42px";


  await wait(900);


  /*
  TICKET
  */

  ticket--;


  ticketText.innerHTML =
  ticket;


  /*
  RESULT
  */

  showResult(
    prize
  );


  statusText.innerHTML =
  "BERHASIL";


  message.innerHTML =
  "🎉 Hadiah berhasil didapatkan.";


  document.getElementById(
    "claimButton"
  ).style.display =
  "block";


  playing = false;

}


/* =====================================
   RESULT
===================================== */

function showResult(
  prize
){

  document.getElementById(
    "resultImage"
  ).src =
  prize.image;


  document.getElementById(
    "resultName"
  ).innerHTML =
  prize.name;


  document.getElementById(
    "resultDesc"
  ).innerHTML =
  prize.description;


  document.getElementById(
    "modal"
  ).style.display =
  "flex";

}


/* =====================================
   WAIT
===================================== */

function wait(ms){

  return new Promise(
    resolve =>
    setTimeout(
      resolve,
      ms
    )
  );

}


/* =====================================
   CLOSE MODAL
===================================== */

document
.getElementById(
  "modal"
)
.addEventListener(
  "click",
  function(e){

    if(
      e.target === this
    ){

      this.style.display =
      "none";

    }

  }
);


/* =====================================
   KEYBOARD
===================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key ===
      "ArrowLeft"
    ){

      moveLeft();

    }


    if(
      e.key ===
      "ArrowRight"
    ){

      moveRight();

    }


    if(
      e.key ===
      "Enter"
    ){

      grabPrize();

    }

  }
);

</script>

</body>
</html>
