<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#020713"
>

<title>
MAUSLOT 9.9 Claw Machine
</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  position:relative;

  overflow-x:hidden;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#ffffff;

  background:#020713;
}



/* =========================================================
   BACKGROUND
========================================================= */

.bg-wall{
  position:fixed;

  inset:0;

  z-index:0;

  pointer-events:none;

  background:
    url("./assets/bg-arcade-3d.jpg")
    center center /
    cover
    no-repeat;

  transform:scale(1.015);
}


.bg-overlay{
  position:fixed;

  inset:0;

  z-index:1;

  pointer-events:none;

  background:

    linear-gradient(
      180deg,
      rgba(1,5,13,.14) 0%,
      rgba(1,6,15,.20) 34%,
      rgba(1,6,15,.42) 100%
    );
}


.bg-vignette{
  position:fixed;

  inset:0;

  z-index:2;

  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 35%,
      transparent 0%,
      transparent 31%,
      rgba(0,0,0,.15) 57%,
      rgba(0,0,0,.50) 100%
    );
}



/* =========================================================
   SCENE LIGHT
========================================================= */

.floor-light{
  position:fixed;

  left:50%;

  bottom:-80px;

  width:820px;
  height:280px;

  transform:
    translateX(-50%);

  border-radius:50%;

  z-index:2;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse,
      rgba(46,147,255,.24) 0%,
      rgba(255,199,67,.10) 37%,
      transparent 72%
    );

  filter:
    blur(26px);
}


.spotlight{
  position:fixed;

  top:-20%;

  width:24%;
  height:92%;

  z-index:2;

  pointer-events:none;

  opacity:.13;

  filter:
    blur(8px);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.06) 0%,
      rgba(104,188,255,.23) 28%,
      rgba(255,218,125,.13) 58%,
      transparent 100%
    );

  clip-path:
    polygon(
      43% 0%,
      57% 0%,
      100% 100%,
      0% 100%
    );
}


.spot-left{
  left:12%;

  transform:
    rotate(7deg);
}


.spot-center{
  left:50%;

  transform:
    translateX(-50%);
}


.spot-right{
  right:12%;

  transform:
    rotate(-7deg);
}



/* =========================================================
   SIDE LIGHT
========================================================= */

.side-glow{
  position:fixed;

  top:0;

  width:19%;
  height:100%;

  z-index:2;

  pointer-events:none;

  opacity:.23;

  filter:
    blur(8px);
}


.side-left{
  left:0;

  background:
    linear-gradient(
      90deg,
      rgba(66,157,255,.16),
      transparent 72%
    );
}


.side-right{
  right:0;

  background:
    linear-gradient(
      270deg,
      rgba(255,196,61,.15),
      transparent 72%
    );
}



/* =========================================================
   MOVING LIGHT SWEEP
========================================================= */

.light-sweep{
  position:fixed;

  top:-12%;

  left:-42%;

  width:30%;
  height:135%;

  z-index:2;

  pointer-events:none;

  opacity:.10;

  transform:
    rotate(10deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(96,180,255,.09),
      rgba(255,255,255,.18),
      rgba(255,208,77,.08),
      transparent
    );

  filter:
    blur(10px);

  animation:
    sweepMove
    10s
    ease-in-out
    infinite;
}


@keyframes sweepMove{

  0%{
    left:-42%;
  }

  45%{
    left:110%;
  }

  100%{
    left:110%;
  }

}



/* =========================================================
   PARTICLES
========================================================= */

.particles{
  position:fixed;

  inset:0;

  z-index:2;

  pointer-events:none;

  overflow:hidden;
}


.particle{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#ffd86a;

  box-shadow:
    0 0 7px
    rgba(255,211,95,.75);

  opacity:.22;

  animation:
    particleFloat
    8s
    linear
    infinite;
}


.p1{
  left:8%;
  top:82%;
}

.p2{
  left:17%;
  top:72%;
  animation-delay:1.5s;
}

.p3{
  left:28%;
  top:88%;
  animation-delay:3.2s;
}

.p4{
  right:9%;
  top:80%;
  animation-delay:.8s;
}

.p5{
  right:18%;
  top:69%;
  animation-delay:2.3s;
}

.p6{
  right:28%;
  top:87%;
  animation-delay:4s;
}


@keyframes particleFloat{

  0%{
    transform:
      translateY(0)
      scale(.8);

    opacity:0;
  }

  20%{
    opacity:.32;
  }

  80%{
    opacity:.20;
  }

  100%{
    transform:
      translateY(-250px)
      scale(1.15);

    opacity:0;
  }

}



/* =========================================================
   MAIN PAGE
========================================================= */

.page{
  position:relative;

  z-index:5;

  width:100%;

  max-width:510px;

  margin:0 auto;

  padding:
    12px
    12px
    34px;
}



/* =========================================================
   LOGO
========================================================= */

.logo{
  text-align:center;

  margin-bottom:5px;
}


.logo img{
  display:block;

  width:255px;

  max-width:78%;

  height:auto;

  margin:0 auto;

  object-fit:contain;

  filter:
    drop-shadow(
      0 6px 12px
      rgba(0,0,0,.48)
    );
}



/* =========================================================
   TITLE
========================================================= */

.title{
  text-align:center;

  margin-bottom:11px;
}


.title small{
  display:block;

  color:#b6c7da;

  font-size:9px;

  font-weight:bold;

  letter-spacing:3px;

  text-shadow:
    0 2px 4px
    rgba(0,0,0,.75);
}


.title h1{
  margin:
    4px 0;

  color:#ffd764;

  font-size:30px;

  line-height:1;

  text-shadow:

    0 2px 0
    #724904,

    0 0 17px
    rgba(255,202,50,.38),

    0 6px 12px
    rgba(0,0,0,.62);
}


.title p{
  margin:
    6px 0 0;

  color:#e3e9ef;

  font-size:9px;

  letter-spacing:1.5px;

  text-shadow:
    0 2px 4px
    rgba(0,0,0,.72);
}



/* =========================================================
   STATUS
========================================================= */

.status-row{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-bottom:10px;
}


.status-box{
  padding:
    9px 8px;

  text-align:center;

  border-radius:12px;

  border:
    1px solid
    rgba(217,173,53,.72);

  background:
    linear-gradient(
      180deg,
      rgba(9,29,50,.89),
      rgba(3,11,20,.95)
    );

  backdrop-filter:
    blur(8px);

  box-shadow:

    0 8px 20px
    rgba(0,0,0,.28),

    inset 0 1px 0
    rgba(255,255,255,.04);
}


.status-box span{
  display:block;

  font-size:8px;

  color:#94a5b9;

  letter-spacing:1px;
}


.status-box strong{
  display:block;

  margin-top:4px;

  color:#ffd75e;

  font-size:14px;
}



/* =========================================================
   MACHINE STAGE
========================================================= */

.machine-stage{
  position:relative;

  margin-top:0;

  padding-bottom:74px;
}



/* FLOOR GLOW */

.machine-floor-glow{
  position:absolute;

  left:50%;

  bottom:29px;

  width:82%;
  height:82px;

  transform:
    translateX(-50%);

  z-index:1;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(53,151,255,.24) 0%,
      rgba(255,199,71,.11) 38%,
      transparent 77%
    );

  filter:
    blur(17px);
}


.machine-floor-shine{
  position:absolute;

  left:50%;

  bottom:18px;

  width:88%;
  height:40px;

  transform:
    translateX(-50%);

  z-index:2;

  border-radius:50%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(119,191,255,.10),
      rgba(255,255,255,.22),
      rgba(255,209,95,.10),
      transparent
    );

  filter:
    blur(9px);
}



/* REFLECTION */

.machine-reflection{
  position:absolute;

  left:50%;

  bottom:-46px;

  width:94%;

  transform:
    translateX(-50%)
    scaleY(-1);

  z-index:0;

  opacity:.13;

  filter:
    blur(5px);

  pointer-events:none;

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.50),
      rgba(255,255,255,.13),
      transparent 75%
    );

  mask-image:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.50),
      rgba(255,255,255,.13),
      transparent 75%
    );
}



/* MACHINE WRAPPER */

.machine-wrap{
  position:relative;

  width:107%;

  margin-left:-3.5%;

  aspect-ratio:
    3 / 4.05;

  z-index:5;

  filter:

    drop-shadow(
      0 24px 34px
      rgba(0,0,0,.56)
    )

    drop-shadow(
      0 0 32px
      rgba(31,126,255,.12)
    );
}


.machine-frame{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  z-index:1;

  pointer-events:none;
}



/* =========================================================
   GAME GLASS
========================================================= */

.game-glass{
  position:absolute;

  left:15.4%;
  right:15.4%;

  top:15.7%;
  bottom:34.1%;

  z-index:5;

  overflow:hidden;

  border-radius:10px;

  background:
    radial-gradient(
      circle at 50% 24%,
      rgba(18,87,157,.98),
      rgba(8,45,84,.98) 38%,
      rgba(3,22,42,.98) 72%,
      rgba(2,11,21,.98) 100%
    );

  box-shadow:

    inset 0 0 30px
    rgba(0,145,255,.27),

    inset 0 -48px 68px
    rgba(0,0,0,.35);
}


/* GLASS REFLECTION */

.game-glass::before{
  content:"";

  position:absolute;

  left:-12%;
  top:0;

  width:47%;
  height:100%;

  z-index:18;

  pointer-events:none;

  background:
    linear-gradient(
      105deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.04) 33%,
      transparent 57%
    );
}


.game-glass::after{
  content:"";

  position:absolute;

  inset:0;

  z-index:60;

  pointer-events:none;

  background:
    linear-gradient(
      112deg,
      rgba(255,255,255,.07),
      transparent 24%,
      transparent 74%,
      rgba(255,255,255,.025)
    );
}



/* =========================================================
   MACHINE LIGHT
========================================================= */

.lights{
  position:absolute;

  top:4.5%;

  left:12%;
  right:12%;

  display:flex;

  justify-content:
    space-between;

  z-index:8;
}


.light{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#69c2ff;

  box-shadow:

    0 0 8px
    #69c2ff,

    0 0 16px
    #278fff;

  animation:
    insideLight
    1.8s
    ease-in-out
    infinite;
}


.light:nth-child(2){
  animation-delay:.5s;
}

.light:nth-child(3){
  animation-delay:1s;
}


@keyframes insideLight{

  0%,
  100%{
    opacity:.55;
  }

  50%{
    opacity:1;
  }

}



/* =========================================================
   INNER FLOOR
========================================================= */

.inner-floor-glow{
  position:absolute;

  left:8%;
  right:8%;

  bottom:5%;

  height:18px;

  z-index:9;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      rgba(119,193,255,.22),
      rgba(255,208,87,.08) 48%,
      transparent 75%
    );

  filter:
    blur(6px);
}



/* =========================================================
   RAIL
========================================================= */

.rail{
  position:absolute;

  top:9%;

  left:7%;
  right:7%;

  height:6px;

  z-index:10;

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      #ffe888,
      #c58b16
    );

  box-shadow:
    0 0 10px
    rgba(255,211,66,.55);
}



/* =========================================================
   CLAW
========================================================= */

.claw-system{
  position:absolute;

  left:50%;

  top:5.5%;

  width:110px;

  transform:
    translateX(-50%);

  z-index:40;

  transition:
    left .28s ease;

  pointer-events:none;
}


.carriage{
  width:42px;
  height:23px;

  margin:0 auto;

  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      #ffeb86,
      #aa7310
    );

  border:
    2px solid
    #ffe989;

  box-shadow:
    0 0 10px
    rgba(255,210,55,.42);
}


.cable{
  width:4px;

  height:42px;

  margin:0 auto;

  background:
    linear-gradient(
      90deg,
      #393939,
      #d8d8d8,
      #434343
    );

  transition:
    height
    .75s
    cubic-bezier(.4,0,.2,1);
}


.claw-holder{
  position:relative;

  width:100px;

  margin:0 auto;
}


.claw-img{
  display:block;

  width:100%;

  height:auto;

  object-fit:contain;

  filter:
    drop-shadow(
      0 7px 9px
      rgba(0,0,0,.60)
    );
}


.caught{
  position:absolute;

  left:50%;

  bottom:-28px;

  width:48px;
  height:48px;

  transform:
    translateX(-50%);

  object-fit:contain;

  display:none;

  filter:
    drop-shadow(
      0 5px 7px
      rgba(0,0,0,.60)
    );
}


.claw-holder.has-prize
.caught{
  display:block;
}



/* =========================================================
   PRIZE AREA
========================================================= */

.prize-floor{
  position:absolute;

  left:4%;
  right:4%;

  bottom:.5%;

  height:32%;

  z-index:20;
}



/* =========================================================
   PRIZE BALLS
========================================================= */

.ball{
  position:absolute;

  width:21%;

  aspect-ratio:1;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  border:
    1.5px solid
    rgba(255,255,255,.38);

  background:
    radial-gradient(
      circle at 30% 22%,
      rgba(255,255,255,.55),
      rgba(57,128,205,.15) 34%,
      rgba(4,13,26,.18) 70%
    );

  box-shadow:

    inset 0 0 15px
    rgba(255,255,255,.16),

    0 7px 14px
    rgba(0,0,0,.42);

  animation:
    floatBall
    3s
    ease-in-out
    infinite;

  transition:
    opacity .3s,
    filter .3s;
}


.ball img{
  width:78%;
  height:78%;

  object-fit:contain;

  pointer-events:none;

  filter:
    drop-shadow(
      0 3px 5px
      rgba(0,0,0,.35)
    );
}


@keyframes floatBall{

  0%,
  100%{
    transform:
      translateY(0);
  }

  50%{
    transform:
      translateY(-3px);
  }

}



/* =========================================================
   BALL POSITIONS
========================================================= */

.b1{
  left:0;
  bottom:0;
}


.b2{
  left:20%;
  bottom:17%;
}


.b3{
  left:40%;
  bottom:0;
}


.b4{
  right:20%;
  bottom:18%;
}


.b5{
  right:0;
  bottom:0;
}


.b6{
  left:50%;

  bottom:40%;

  width:23%;

  transform:
    translateX(-50%);

  animation:none;

  background:
    radial-gradient(
      circle at 32% 22%,
      #fff3ad,
      rgba(255,194,39,.5) 40%,
      rgba(125,71,0,.27) 75%
    );

  box-shadow:

    0 0 26px
    rgba(255,198,39,.7),

    inset 0 0 15px
    rgba(255,255,255,.32);
}


.b7{
  left:4%;

  bottom:31%;

  width:18%;
}


.b8{
  right:4%;

  bottom:31%;

  width:18%;
}


.ball.winner{
  filter:
    brightness(1.25);

  border-color:
    #ffe66f;

  box-shadow:

    0 0 32px
    rgba(255,205,50,1),

    inset 0 0 16px
    rgba(255,255,255,.4);
}



/* =========================================================
   ARCADE CONTROL CONSOLE
========================================================= */

.control{
  position:relative;

  margin-top:0;

  padding:
    17px
    16px
    16px;

  overflow:hidden;

  border-radius:
    22px
    22px
    28px
    28px;

  border:
    2px solid
    #b98418;

  background:
    linear-gradient(
      180deg,
      #173b61 0%,
      #0a213b 16%,
      #07172a 52%,
      #030b15 100%
    );

  box-shadow:

    inset 0 2px 0
    rgba(255,255,255,.12),

    inset 0 -7px 14px
    rgba(0,0,0,.55),

    0 12px 28px
    rgba(0,0,0,.48),

    0 0 22px
    rgba(255,197,52,.10);
}


.control::before{
  content:"";

  position:absolute;

  left:4%;
  right:4%;

  top:7px;

  height:3px;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #684405,
      #ffe282,
      #9c6810,
      #ffe282,
      #684405
    );

  box-shadow:
    0 0 9px
    rgba(255,209,72,.30);
}


.control::after{
  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,.07),
      transparent 24%,
      transparent 75%,
      rgba(255,255,255,.025)
    );
}



/* =========================================================
   LED
========================================================= */

.arcade-led-row{
  position:relative;

  z-index:3;

  display:flex;

  justify-content:center;

  gap:12px;

  margin-bottom:11px;
}


.arcade-led{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#42b5ff;

  box-shadow:

    0 0 6px
    #42b5ff,

    0 0 13px
    rgba(58,174,255,.65);

  animation:
    consoleLed
    1.7s
    ease-in-out
    infinite;
}


.arcade-led:nth-child(2){

  background:#ffd353;

  box-shadow:

    0 0 6px
    #ffd353,

    0 0 13px
    rgba(255,203,64,.65);

  animation-delay:.3s;
}


.arcade-led:nth-child(3){
  animation-delay:.6s;
}


@keyframes consoleLed{

  0%,
  100%{
    opacity:.45;
  }

  50%{
    opacity:1;
  }

}



/* =========================================================
   ARCADE BUTTONS
========================================================= */

.buttons{
  position:relative;

  z-index:3;

  display:grid;

  grid-template-columns:
    76px
    1fr
    76px;

  gap:12px;

  align-items:center;
}


button{
  position:relative;

  height:58px;

  border-radius:50%;

  border:
    3px solid
    #d3a128;

  background:
    radial-gradient(
      circle at 35% 27%,
      #284e79 0%,
      #102c4c 42%,
      #061426 72%,
      #020811 100%
    );

  color:#ffd75d;

  font-size:23px;

  font-weight:bold;

  cursor:pointer;

  touch-action:manipulation;

  box-shadow:

    inset 0 3px 4px
    rgba(255,255,255,.13),

    inset 0 -8px 10px
    rgba(0,0,0,.48),

    0 5px 0
    #76500c,

    0 10px 15px
    rgba(0,0,0,.38),

    0 0 13px
    rgba(255,199,56,.10);

  transition:
    transform .08s ease,
    box-shadow .08s ease;
}


button:active{
  transform:
    translateY(4px);

  box-shadow:

    inset 0 3px 7px
    rgba(0,0,0,.42),

    0 1px 0
    #76500c,

    0 5px 8px
    rgba(0,0,0,.30);
}


button:disabled{
  opacity:.38;
}



/* =========================================================
   GRAB BUTTON
========================================================= */

.grab{
  height:64px;

  border-radius:32px;

  color:#191005;

  font-size:15px;

  letter-spacing:.6px;

  border:
    3px solid
    #8f620c;

  background:
    radial-gradient(
      circle at 50% 22%,
      #fff9cb 0%,
      #ffe46e 27%,
      #f7bc2b 62%,
      #ad7006 100%
    );

  box-shadow:

    inset 0 4px 5px
    rgba(255,255,255,.72),

    inset 0 -10px 13px
    rgba(142,82,0,.40),

    0 6px 0
    #785008,

    0 11px 18px
    rgba(0,0,0,.40),

    0 0 22px
    rgba(255,204,62,.36);

  animation:
    grabArcadeGlow
    2s
    ease-in-out
    infinite;
}


@keyframes grabArcadeGlow{

  0%,
  100%{
    filter:
      brightness(1);
  }

<script>

/* =========================================================
   PRIZE DATA
========================================================= */

const prizes = [

  {

    name:
    "BONUS SALDO",

    image:

    description:
    "Bonus saldo spesial Event 9.9."

  },


  {

  },

  },


  {

  },


  {

    description:
    "Tambahan VIP Point berhasil didapatkan."

  },


  {

    name:
    "GRAND PRIZE",

    image:
    "./assets/grand%20prize.png",

    description:

  },


  {

    description:

  },

    image:

    description:
    "Mystery Reward berhasil didapatkan."

  }

];



/* =========================================================
   GAME STATE
========================================================= */

let ticket =
1;


let position =
50;


let playing =
false;



/* =========================================================
   ELEMENTS
========================================================= */

const gameGlass =
document.getElementById(
  "gameGlass"
);


const clawSystem =
document.getElementById(
  "clawSystem"
);


const cable =
document.getElementById(
  "cable"
);


const clawHolder =
document.getElementById(
  "clawHolder"
);


const clawImage =
document.getElementById(
  "clawImage"
);


const caughtPrize =
document.getElementById(
  "caughtPrize"
);


const statusText =
document.getElementById(
  "status"
);


const ticketText =
document.getElementById(
  "ticket"
);


const message =
document.getElementById(
  "message"
);


const leftButton =
document.getElementById(
  "leftButton"
);


const rightButton =
document.getElementById(
  "rightButton"
);


const grabButton =
document.getElementById(
  "grabButton"
);



/* =========================================================
   CLAW POSITION
========================================================= */

function updatePosition(){

  clawSystem.style.left =
  position + "%";

}



/* =========================================================
   MOVE LEFT
========================================================= */

function moveLeft(){

  if(playing){
    return;
  }


  position -= 8;


  if(
    position < 12
  ){

    position =
    12;

  }


  updatePosition();


  message.innerHTML =
  "Capit bergerak ke kiri.";

}



/* =========================================================
   MOVE RIGHT
========================================================= */

function moveRight(){

  if(playing){
    return;
  }


  position += 8;


  if(
    position > 88
  ){

    position =
    88;

  }


  updatePosition();


  message.innerHTML =
  "Capit bergerak ke kanan.";

}



/* =========================================================
   GET PRIZE CENTER
========================================================= */

function getPrizeCenter(
  element
){

  const glassRect =
  gameGlass
  .getBoundingClientRect();


  const prizeRect =
  element
  .getBoundingClientRect();


  return {

    x:

      (
        prizeRect.left -
        glassRect.left
      )

      +

      (
        prizeRect.width /
        2
      ),


    y:

      (
        prizeRect.top -
        glassRect.top
      )

      +

      (
        prizeRect.height /
        2
      )

  };

}



/* =========================================================
   FIND CLOSEST PRIZE
========================================================= */

function findClosestPrize(){

  const balls =
  document.querySelectorAll(
    ".ball"
  );


  const glassRect =
  gameGlass
  .getBoundingClientRect();


  const targetX =

  glassRect.width *

  (
    position /
    100
  );


  let winner =
  0;


  let smallest =
  Infinity;



  balls.forEach(
    (
      ball,
      index
    ) => {


      if(
        ball.style.opacity ===
        "0"
      ){

        return;

      }


      const center =
      getPrizeCenter(
        ball
      );


      const distance =
      Math.abs(
        center.x -
        targetX
      );


      if(
        distance <
        smallest
      ){

        smallest =
        distance;


        winner =
        index;

      }


    }
  );


  return winner;

}



/* =========================================================
   MOVE CLAW EXACTLY TO PRIZE
========================================================= */

function moveToPrize(
  prizeElement
){

  const glassRect =
  gameGlass
  .getBoundingClientRect();


  const center =
  getPrizeCenter(
    prizeElement
  );


  const percentage =

  (
    center.x /
    glassRect.width
  )

  *

  100;


  position =
  Math.max(

    12,

    Math.min(
      88,
      percentage
    )

  );


  updatePosition();

}



/* =========================================================
   AUTO CALCULATE DROP
========================================================= */

function calculateDrop(
  prizeElement
){

  const glassRect =
  gameGlass
  .getBoundingClientRect();


  const prizeRect =
  prizeElement
  .getBoundingClientRect();


  const clawRect =
  clawImage
  .getBoundingClientRect();



  const prizeCenterY =

  (
    prizeRect.top -
    glassRect.top
  )

  +

  (
    prizeRect.height /
    2
  );



  const clawBottom =

  clawRect.bottom -
  glassRect.top;



  /*
  Capit diturunkan sedikit
  masuk ke tengah bola
  agar terlihat menjepit.
  */

  const targetY =

  prizeCenterY

  -

  (
    prizeRect.height *
    .08
  );



  let drop =

  targetY -
  clawBottom;



  if(
    drop < 0
  ){

    drop =
    0;

  }



  const maxDrop =

  glassRect.height *
  .62;



  if(
    drop >
    maxDrop
  ){

    drop =
    maxDrop;

  }



  return

  42 +
  drop;

}



/* =========================================================
   LOCK CONTROL
========================================================= */

function lockControls(){

  leftButton.disabled =
  true;


  rightButton.disabled =
  true;


  grabButton.disabled =
  true;

}



function unlockControls(){

  leftButton.disabled =
  false;


  rightButton.disabled =
  false;


  grabButton.disabled =
  false;

}



/* =========================================================
   GRAB PRIZE
========================================================= */

async function grabPrize(){

  if(
    playing
  ){

    return;

  }



  if(
    ticket <= 0
  ){

    message.innerHTML =
    "Tiket bermain sudah habis.";


    return;

  }



  playing =
  true;



  lockControls();



  /*
  RESET CLAW
  */

  clawImage.src =
  "./assets/claw%20open.png";


  clawHolder
  .classList
  .remove(
    "has-prize"
  );


  caughtPrize.src =
  "";



  /*
  FIND TARGET
  */

  const winnerIndex =
  findClosestPrize();



  const prize =
  prizes[
    winnerIndex
  ];



  const prizeElement =
  document.querySelector(

    `.ball[data-id="${winnerIndex}"]`

  );



  /*
  MOVE HORIZONTAL
  */

  statusText.innerHTML =
  "MENUJU HADIAH";


  message.innerHTML =
  "Capit sedang menuju hadiah...";


  moveToPrize(
    prizeElement
  );


  await wait(
    500
  );



  /*
  CALCULATE VERTICAL
  */

  const dropHeight =
  calculateDrop(
    prizeElement
  );



  /*
  DROP
  */

  statusText.innerHTML =
  "GRABBING";


  message.innerHTML =
  "Capit sedang turun...";


  cable.style.height =
  dropHeight +
  "px";


  await wait(
    800
  );



  /*
  CLOSE CLAW
  */

  clawImage.src =
  "./assets/claw%20close.png";


  prizeElement
  .classList
  .add(
    "winner"
  );


  await wait(
    330
  );



  /*
  ATTACH PRIZE
  */

  caughtPrize.src =
  prize.image;


  clawHolder
  .classList
  .add(
    "has-prize"
  );


  prizeElement.style.opacity =
  "0";


  await wait(
    350
  );



  /*
  LIFT
  */

  statusText.innerHTML =
  "MENGANGKAT";


  message.innerHTML =
  "Hadiah berhasil tercapit...";


  cable.style.height =
  "42px";


  await wait(
    900
  );



  /*
  TICKET
  */

  ticket--;


  ticketText.innerHTML =
  ticket;



  /*
  SHOW RESULT
  */

  showResult(
    prize
  );



  statusText.innerHTML =
  "BERHASIL";


  message.innerHTML =
  "🎉 Hadiah berhasil didapatkan.";



  document
  .getElementById(
    "claimButton"
  )
  .style
  .display =
  "block";



  playing =
  false;



  if(
    ticket > 0
  ){

    unlockControls();

  }

}



/* =========================================================
   RESULT POPUP
========================================================= */

function showResult(
  prize
){

  document
  .getElementById(
    "resultImage"
  )
  .src =
  prize.image;



  document
  .getElementById(
    "resultName"
  )
  .innerHTML =
  prize.name;



  document
  .getElementById(
    "resultDesc"
  )
  .innerHTML =
  prize.description;



  const modal =
  document.getElementById(
    "modal"
  );


  modal.style.display =
  "flex";


  modal.classList.remove(
    "show"
  );


  void modal.offsetWidth;


  modal.classList.add(
    "show"
  );

}



/* =========================================================
   CLOSE RESULT
========================================================= */

document
.getElementById(
  "modal"
)
.addEventListener(
  "click",
  function(
    e
  ){

    if(
      e.target ===
      this
    ){

      this.classList.remove(
        "show"
      );


      this.style.display =
      "none";

    }

  }
);



/* =========================================================
   WAIT
========================================================= */

function wait(
  ms
){

  return new Promise(

    resolve =>

    setTimeout(
      resolve,
      ms
    )

  );

}



/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  function(
    e
  ){


    if(
      e.key ===
      "ArrowLeft"
    ){

      moveLeft();

    }


    if(
      e.key ===
      "ArrowRight"
    ){

      moveRight();

    }


    if(
      e.key ===
      "Enter"
    ){

      grabPrize();

    }


  }
);



/* =========================================================
   INITIAL
========================================================= */

updatePosition();

</script>


</body>

</html>
