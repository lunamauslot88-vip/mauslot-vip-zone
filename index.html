<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020713">

<title>MAUSLOT VIP - 9.9 Claw Machine</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% -10%,#16477f 0%,#07182f 32%,#020610 68%,#010208 100%);
  overflow-x:hidden;
}

.page{
  width:100%;
  max-width:470px;
  margin:auto;
  min-height:100vh;
  padding:12px 10px 30px;
}

/* =====================
   LOGO
===================== */

.logo{
  text-align:center;
  padding:4px 0 7px;
}

.logo img{
  width:210px;
  max-width:72%;
  height:auto;
  display:block;
  margin:auto;
}

/* =====================
   TITLE
===================== */

.event-title{
  text-align:center;
  padding:2px 10px 11px;
}

.event-title .small{
  font-size:9px;
  letter-spacing:3px;
  color:#94a7bc;
  font-weight:700;
}

.event-title h1{
  margin:4px 0 2px;
  font-size:29px;
  line-height:1;
  color:#ffd96a;
  text-shadow:
    0 2px 0 #704804,
    0 0 17px rgba(255,205,61,.30);
}

.event-title p{
  margin:7px 0 0;
  font-size:9px;
  letter-spacing:1.4px;
  color:#d1d8e2;
}

/* =====================
   STATUS
===================== */

.status-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.status-card{
  padding:8px;
  text-align:center;
  border-radius:11px;
  border:1px solid #74591a;
  background:linear-gradient(180deg,#0b1c31,#06101d);
}

.status-card span{
  display:block;
  color:#8596aa;
  font-size:8px;
  letter-spacing:1px;
}

.status-card strong{
  display:block;
  margin-top:3px;
  color:#ffd65d;
  font-size:14px;
}

/* =====================
   MACHINE
===================== */

.machine-wrap{
  position:relative;
  width:100%;
  aspect-ratio:3 / 4.1;
  margin:auto;
}

.machine-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:30;
  pointer-events:none;
  filter:
    drop-shadow(0 13px 23px rgba(0,0,0,.55))
    drop-shadow(0 0 11px rgba(255,196,47,.16));
}

/* area kaca mesin */

.glass-area{
  position:absolute;

  left:16%;
  right:16%;
  top:16%;
  bottom:30%;

  overflow:hidden;
  z-index:10;

  border-radius:14px;

  background:
    radial-gradient(circle at 50% 20%,rgba(30,119,225,.15),transparent 45%);
}

/* =====================
   RAIL
===================== */

.rail{
  position:absolute;
  top:8%;
  left:6%;
  right:6%;
  height:4px;

  border-radius:10px;

  background:
    linear-gradient(90deg,#72500a,#ffe06b,#72500a);

  box-shadow:
    0 0 8px rgba(255,210,65,.65);

  z-index:11;
}

/* =====================
   CLAW IMAGE
===================== */

.claw{
  position:absolute;

  top:7%;
  left:50%;

  width:23%;

  transform:translateX(-50%);

  transition:
    left .28s ease,
    top .75s ease;

  z-index:40;

  pointer-events:none;
}

.claw img.main-claw{
  width:100%;
  height:auto;
  display:block;

  filter:
    drop-shadow(0 5px 7px rgba(0,0,0,.5));
}

/* turun */

.claw.grabbing{
  top:48%;
}

/* hadiah ikut naik */

.caught{
  position:absolute;

  width:50%;
  height:auto;

  left:50%;
  bottom:-24%;

  transform:translateX(-50%);

  display:none;

  object-fit:contain;

  filter:
    drop-shadow(0 5px 8px rgba(0,0,0,.55));
}

.claw.has-prize .caught{
  display:block;
}

/* =====================
   PRIZE FLOOR
===================== */

.prize-floor{
  position:absolute;

  left:3%;
  right:3%;
  bottom:5%;

  height:43%;

  z-index:12;
}

/* =====================
   BALL
===================== */

.ball{
  position:absolute;

  width:21%;
  aspect-ratio:1;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.46);

  background:
    radial-gradient(
      circle at 32% 24%,
      rgba(255,255,255,.52),
      rgba(58,127,204,.17) 34%,
      rgba(4,12,24,.20) 70%
    );

  box-shadow:
    inset 0 0 13px rgba(255,255,255,.18),
    0 6px 12px rgba(0,0,0,.45);

  transition:
    opacity .3s,
    filter .3s;

  animation:float 3s ease-in-out infinite;
}

.ball img{
  width:78%;
  height:78%;
  object-fit:contain;

  filter:
    drop-shadow(0 3px 5px rgba(0,0,0,.35));

  pointer-events:none;
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(-2deg);
  }

  50%{
    transform:translateY(-4px) rotate(2deg);
  }
}

/* posisi bola */

.b1{
  left:0;
  bottom:0;
}

.b2{
  left:19%;
  bottom:28%;
}

.b3{
  left:39%;
  bottom:1%;
}

.b4{
  right:19%;
  bottom:29%;
}

.b5{
  right:0;
  bottom:1%;
}

/* grand prize */

.b6{
  left:50%;
  bottom:57%;

  width:23%;

  transform:translateX(-50%);

  animation:none;

  background:
    radial-gradient(
      circle at 32% 24%,
      rgba(255,255,255,.85),
      rgba(255,200,52,.50) 34%,
      rgba(120,67,0,.24) 72%
    );

  box-shadow:
    0 0 23px rgba(255,198,42,.70),
    inset 0 0 15px rgba(255,255,255,.3);
}

.b7{
  left:4%;
  bottom:49%;
  width:18%;
}

.b8{
  right:4%;
  bottom:50%;
  width:18%;
}

/* winner */

.ball.winner{
  border-color:#ffe474;

  filter:brightness(1.2);

  box-shadow:
    0 0 30px rgba(255,205,52,.95),
    inset 0 0 15px rgba(255,255,255,.38);
}

/* =====================
   CONTROL
===================== */

.control-panel{
  margin-top:8px;

  padding:10px;

  border-radius:15px;

  border:1px solid #6c5518;

  background:
    linear-gradient(180deg,#0d1b2c,#060b12);

  box-shadow:
    0 8px 18px rgba(0,0,0,.3);
}

.controls{
  display:grid;
  grid-template-columns:65px 1fr 65px;
  gap:8px;
}

.btn{
  height:48px;

  border-radius:11px;

  border:1px solid #b18a22;

  background:#0d1c30;

  color:#ffd55d;

  font-size:19px;
  font-weight:900;

  cursor:pointer;
}

.btn:active{
  transform:scale(.96);
}

.grab-btn{
  color:#07101a;

  font-size:14px;

  background:
    linear-gradient(
      180deg,
      #ffea82,
      #d5a126
    );

  border-color:#ffe276;

  box-shadow:
    0 0 13px rgba(255,200,49,.20);
}

.btn:disabled{
  opacity:.4;
}

/* =====================
   MESSAGE
===================== */

.message{
  min-height:40px;

  padding:9px 4px 0;

  text-align:center;

  color:#c4ccd7;

  font-size:10px;

  line-height:1.5;
}

/* =====================
   CLAIM
===================== */

.claim{
  display:none;

  width:100%;

  margin-top:7px;

  padding:12px 9px;

  text-align:center;

  text-decoration:none;

  border-radius:10px;

  color:#07101a;

  font-size:12px;
  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #855e09,
      #f6d25e,
      #8a620a
    );
}

/* =====================
   MODAL
===================== */

.modal{
  position:fixed;
  inset:0;

  z-index:9999;

  display:none;
  align-items:center;
  justify-content:center;

  padding:18px;

  background:
    rgba(0,0,0,.84);

  backdrop-filter:blur(5px);
}

.modal-box{
  width:100%;
  max-width:330px;

  text-align:center;

  padding:22px 17px 17px;

  border-radius:20px;

  border:2px solid #dbaa36;

  background:
    radial-gradient(circle at top,#163c6d,#07111f 58%);

  box-shadow:
    0 0 38px rgba(255,196,43,.25);
}

.reward-img{
  width:115px;
  height:115px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:1px solid #806319;

  background:
    radial-gradient(circle,#174278,#071426);

  box-shadow:
    0 0 25px rgba(255,201,50,.22);
}

.reward-img img{
  max-width:100px;
  max-height:100px;

  object-fit:contain;

  filter:
    drop-shadow(0 5px 7px rgba(0,0,0,.45));
}

.modal-small{
  margin-top:12px;

  font-size:8px;

  letter-spacing:2px;

  color:#8798ad;
}

.modal h2{
  margin:5px 0;

  color:#ffd55c;

  font-size:21px;
}

.reward-name{
  margin:10px 0 4px;

  color:#fff;

  font-size:18px;
  font-weight:900;
}

.reward-desc{
  color:#bdc7d4;

  font-size:10px;

  line-height:1.5;
}

.modal-claim{
  display:block;

  margin-top:14px;

  padding:12px;

  border-radius:9px;

  background:
    linear-gradient(
      90deg,
      #865f08,
      #f7d461,
      #865f08
    );

  color:#07101a;

  font-size:11px;
  font-weight:900;

  text-decoration:none;
}

.footer{
  text-align:center;

  padding:12px 5px 0;

  color:#607085;

  font-size:8px;
}

/* mobile */

@media(max-width:370px){

  .event-title h1{
    font-size:25px;
  }

  .controls{
    grid-template-columns:58px 1fr 58px;
  }

}
</style>
</head>


<body>

<div class="page">

  <!-- LOGO -->

  <div class="logo">

    <img
      src="assets/logo-mauslot.png"
      alt="MAUSLOT">

  </div>


  <!-- TITLE -->

  <div class="event-title">

    <div class="small">
      EVENT SPECIAL
    </div>

    <h1>
      9.9 CLAW MACHINE
    </h1>

    <p>
      GRAB IT • WIN IT • CLAIM IT
    </p>

  </div>


  <!-- STATUS -->

  <div class="status-row">

    <div class="status-card">

      <span>
        TIKET BERMAIN
      </span>

      <strong id="ticket">
        1
      </strong>

    </div>


    <div class="status-card">

      <span>
        STATUS
      </span>

      <strong id="statusText">
        SIAP MAIN
      </strong>

    </div>

  </div>


  <!-- MACHINE -->

  <div class="machine-wrap">


    <!-- BAGIAN DALAM -->

    <div class="glass-area">


      <div class="rail"></div>


      <!-- CLAW -->

      <div
        class="claw"
        id="claw">

        <img
          class="main-claw"
          id="clawImage"
          src="assets/futuristic_gold_arcade_claw_mechanism.png"
          alt="">


        <img
          class="caught"
          id="caughtPrize"
          src=""
          alt="">

      </div>


      <!-- HADIAH -->

      <div class="prize-floor">


        <div
          class="ball b1"
          data-id="0">

          <img
            src="assets/coin.png"
            alt="">

        </div>


        <div
          class="ball b2"
          data-id="1">

          <img
            src="assets/gift.png"
            alt="">

        </div>


        <div
          class="ball b3"
          data-id="2">

          <img
            src="assets/diamond.png"
            alt="">

        </div>


        <div
          class="ball b4"
          data-id="3">

          <img
            src="assets/crown.png"
            alt="">

        </div>


        <div
          class="ball b5"
          data-id="4">

          <img
            src="assets/chip.png"
            alt="">

        </div>


        <div
          class="ball b6"
          data-id="5">

          <img
            src="assets/grand%20prize.png"
            alt="">

        </div>


        <div
          class="ball b7"
          data-id="6">

          <img
            src="assets/ticket.png"
            alt="">

        </div>


        <div
          class="ball b8"
          data-id="7">

          <img
            src="assets/mystery.png"
            alt="">

        </div>


      </div>

    </div>


    <!-- FRAME MESIN -->

    <img
      class="machine-img"
      src="assets/luxury_navy_gold_claw_machine.png"
      alt="">

  </div>


  <!-- CONTROLS -->

  <div class="control-panel">


    <div class="controls">


      <button
        class="btn"
        id="leftBtn"
        onclick="moveLeft()">

        ◀

      </button>


      <button
        class="btn grab-btn"
        id="grabBtn"
        onclick="playClaw()">

        🎯 GRAB

      </button>


      <button
        class="btn"
        id="rightBtn"
        onclick="moveRight()">

        ▶

      </button>


    </div>


    <div
      class="message"
      id="message">

      Gerakkan capit ke hadiah pilihan lalu tekan
      <b>GRAB</b>.

    </div>


    <a
      href="https://mauslot.life/"
      class="claim"
      id="claimButton">

      🎁 CLAIM HADIAH

    </a>


  </div>


  <div class="footer">

    MAUSLOT VIP • EVENT SPECIAL 9.9

  </div>

</div>



<!-- MODAL -->

<div
  class="modal"
  id="rewardModal">


  <div class="modal-box">


    <div class="reward-img">

      <img
        id="rewardImage"
        src="assets/gift.png"
        alt="">

    </div>


    <div class="modal-small">

      MAUSLOT 9.9 CLAW MACHINE

    </div>


    <h2>
      SELAMAT!
    </h2>


    <div
      class="reward-name"
      id="rewardName">

      VIP REWARD

    </div>


    <div
      class="reward-desc"
      id="rewardDescription">

      Hadiah berhasil didapatkan.

    </div>


    <a
      href="https://mauslot.life/"
      class="modal-claim">

      🎁 CLAIM HADIAH

    </a>


  </div>

</div>


<script>

/* ==========================
   PRIZES
========================== */

const prizes = [

  {
    name:"BONUS SALDO",
    image:"assets/coin.png",
    description:"Bonus saldo spesial Event 9.9.",
    position:14
  },

  {
    name:"VIP GIFT",
    image:"assets/gift.png",
    description:"Hadiah eksklusif khusus member VIP.",
    position:29
  },

  {
    name:"DIAMOND REWARD",
    image:"assets/diamond.png",
    description:"Diamond Reward spesial MAUSLOT.",
    position:43
  },

  {
    name:"CROWN REWARD",
    image:"assets/crown.png",
    description:"Reward premium khusus Event 9.9.",
    position:59
  },

  {
    name:"VIP POINT",
    image:"assets/chip.png",
    description:"VIP Point berhasil didapatkan.",
    position:78
  },

  {
    name:"GRAND PRIZE",
    image:"assets/grand%20prize.png",
    description:"Grand Prize spesial MAUSLOT 9.9.",
    position:50
  },

  {
    name:"VIP TICKET",
    image:"assets/ticket.png",
    description:"VIP Ticket spesial berhasil didapatkan.",
    position:20
  },

  {
    name:"MYSTERY REWARD",
    image:"assets/mystery.png",
    description:"Mystery Reward berhasil didapatkan.",
    position:84
  }

];


/* ==========================
   STATE
========================== */

let ticket = 1;

let clawPosition = 50;

let playing = false;


/* ==========================
   ELEMENTS
========================== */

const claw =
document.getElementById("claw");

const clawImage =
document.getElementById("clawImage");

const caughtPrize =
document.getElementById("caughtPrize");

const ticketEl =
document.getElementById("ticket");

const statusText =
document.getElementById("statusText");

const message =
document.getElementById("message");

const leftBtn =
document.getElementById("leftBtn");

const rightBtn =
document.getElementById("rightBtn");

const grabBtn =
document.getElementById("grabBtn");


/* ==========================
   MOVE LEFT
========================== */

function moveLeft(){

  if(playing){
    return;
  }

  clawPosition -= 8;

  if(clawPosition < 12){

    clawPosition = 12;

  }

  updateClaw();

}


/* ==========================
   MOVE RIGHT
========================== */

function moveRight(){

  if(playing){
    return;
  }

  clawPosition += 8;

  if(clawPosition > 88){

    clawPosition = 88;

  }

  updateClaw();

}


/* ==========================
   UPDATE POSITION
========================== */

function updateClaw(){

  claw.style.left =
  clawPosition + "%";

}


/* ==========================
   CONTROL
========================== */

function disableControls(){

  leftBtn.disabled = true;

  rightBtn.disabled = true;

  grabBtn.disabled = true;

}


function enableControls(){

  leftBtn.disabled = false;

  rightBtn.disabled = false;

  grabBtn.disabled = false;

}


/* ==========================
   GET CLOSEST PRIZE
========================== */

function getClosestPrize(){

  let selected = 0;

  let smallest = 999;


  prizes.forEach(
    (prize,index)=>{

      const distance =
      Math.abs(
        prize.position -
        clawPosition
      );

      if(distance < smallest){

        smallest = distance;

        selected = index;

      }

    }
  );

  return selected;

}


/* ==========================
   PLAY
========================== */

async function playClaw(){

  if(playing){
    return;
  }


  if(ticket <= 0){

    message.innerHTML =
    "Tiket bermain sudah habis.";

    return;

  }


  playing = true;

  disableControls();


  statusText.innerHTML =
  "MEMILIH...";


  message.innerHTML =
  "Capit sedang menuju hadiah...";


  const winnerIndex =
  getClosestPrize();


  const winner =
  prizes[winnerIndex];


  /* PINDAH */

  clawPosition =
  winner.position;

  updateClaw();


  await wait(500);


  /* TURUN */

  statusText.innerHTML =
  "GRABBING";


  claw.classList.add(
    "grabbing"
  );


  await wait(850);


  /* GANTI CAPIT TERTUTUP */

  clawImage.src =
  "assets/golden_arcade_claw_grabber.png";


  highlightPrize(
    winnerIndex
  );


  await wait(450);


  /* HADIAH MASUK KE CAPIT */

  caughtPrize.src =
  winner.image;


  claw.classList.add(
    "has-prize"
  );


  const winnerElement =
  document.querySelector(
    `.ball[data-id="${winnerIndex}"]`
  );


  if(winnerElement){

    winnerElement.style.opacity =
    "0";

  }


  await wait(350);


  /* CAPIT NAIK */

  claw.classList.remove(
    "grabbing"
  );


  statusText.innerHTML =
  "MENGANGKAT...";


  await wait(900);


  /* UPDATE TIKET */

  ticket--;

  ticketEl.innerHTML =
  ticket;


  /* SHOW RESULT */

  showReward(
    winner
  );


  statusText.innerHTML =
  "BERHASIL";


  message.innerHTML =
  "🎉 Hadiah berhasil didapatkan. Silakan lanjutkan claim.";


  document.getElementById(
    "claimButton"
  ).style.display =
  "block";


  playing = false;

}


/* ==========================
   HIGHLIGHT
========================== */

function highlightPrize(index){

  document
  .querySelectorAll(".ball")
  .forEach(
    element=>{

      element.classList.remove(
        "winner"
      );

    }
  );


  const winner =
  document.querySelector(
    `.ball[data-id="${index}"]`
  );


  if(winner){

    winner.classList.add(
      "winner"
    );

  }

}


/* ==========================
   RESULT
========================== */

function showReward(prize){

  document.getElementById(
    "rewardImage"
  ).src =
  prize.image;


  document.getElementById(
    "rewardName"
  ).innerHTML =
  prize.name;


  document.getElementById(
    "rewardDescription"
  ).innerHTML =
  prize.description;


  document.getElementById(
    "rewardModal"
  ).style.display =
  "flex";

}


/* ==========================
   WAIT
========================== */

function wait(ms){

  return new Promise(
    resolve =>
    setTimeout(
      resolve,
      ms
    )
  );

}


/* ==========================
   CLOSE MODAL
========================== */

document
.getElementById(
  "rewardModal"
)
.addEventListener(
  "click",
  function(event){

    if(event.target === this){

      this.style.display =
      "none";

    }

  }
);


/* ==========================
   KEYBOARD
========================== */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "ArrowLeft"){

      moveLeft();

    }

    if(event.key === "ArrowRight"){

      moveRight();

    }

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      playClaw();

    }

  }
);

</script>

</body>
</html>
