<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020713">
<title>MAUSLOT 9.9 Claw Machine</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:
    linear-gradient(rgba(2,7,18,.24),rgba(2,7,18,.44)),
    url("assets/bg-arcade-3d.jpg") center center / cover fixed no-repeat;
  background-color:#020713;
  position:relative;
}

/* =====================================
   SCENE FX
===================================== */

.scene-fx{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}

.scene-vignette{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 32%, transparent 0%, transparent 28%, rgba(0,0,0,.18) 56%, rgba(0,0,0,.52) 100%);
}

.top-ambient{
  position:absolute;
  top:-8%;
  left:50%;
  transform:translateX(-50%);
  width:74%;
  height:32%;
  border-radius:50%;
  background:
    radial-gradient(ellipse, rgba(84,166,255,.14) 0%, rgba(255,205,74,.08) 36%, transparent 72%);
  filter:blur(22px);
}

.side-light{
  position:absolute;
  top:0;
  width:22%;
  height:100%;
  opacity:.34;
  filter:blur(10px);
}

.side-left{
  left:-4%;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.05) 0%,
      rgba(61,148,255,.12) 28%,
      rgba(103,191,255,.08) 44%,
      rgba(255,255,255,.03) 54%,
      transparent 76%);
}

.side-right{
  right:-4%;
  background:
    linear-gradient(270deg,
      rgba(0,0,0,.05) 0%,
      rgba(255,199,72,.13) 24%,
      rgba(255,225,148,.08) 40%,
      rgba(255,255,255,.03) 54%,
      transparent 76%);
}

.spotlight{
  position:absolute;
  top:-18%;
  width:24%;
  height:90%;
  opacity:.15;
  filter:blur(8px);
  background:
    linear-gradient(180deg,
      rgba(255,255,255,.06) 0%,
      rgba(106,188,255,.26) 26%,
      rgba(255,223,132,.16) 54%,
      transparent 100%);
  clip-path:polygon(40% 0%,60% 0%,100% 100%,0% 100%);
}

.spot-left{
  left:14%;
  transform:rotate(7deg);
}

.spot-center{
  left:50%;
  transform:translateX(-50%);
  opacity:.13;
}

.spot-right{
  right:14%;
  transform:rotate(-7deg);
}

.light-sweep{
  position:absolute;
  top:-8%;
  left:-40%;
  width:32%;
  height:130%;
  opacity:.13;
  transform:rotate(10deg);
  background:
    linear-gradient(90deg,
      transparent 0%,
      rgba(126,198,255,.08) 30%,
      rgba(255,255,255,.18) 50%,
      rgba(255,209,87,.08) 70%,
      transparent 100%);
  filter:blur(10px);
  animation:sweepMove 10s ease-in-out infinite;
}

@keyframes sweepMove{
  0%{ left:-42%; }
  45%{ left:108%; }
  100%{ left:108%; }
}

.particles{
  position:absolute;
  inset:0;
}

.particle{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#ffd96d;
  box-shadow:0 0 8px rgba(255,214,106,.85);
  opacity:.28;
  animation:particleFloat 8s linear infinite;
}

.p1{left:10%; top:82%; animation-delay:0s;}
.p2{left:18%; top:72%; animation-delay:1.5s;}
.p3{left:28%; top:88%; animation-delay:3s;}
.p4{right:10%; top:80%; animation-delay:1s;}
.p5{right:18%; top:68%; animation-delay:2.4s;}
.p6{right:28%; top:86%; animation-delay:4.1s;}

@keyframes particleFloat{
  0%{
    transform:translateY(0) scale(.8);
    opacity:0;
  }
  18%{
    opacity:.34;
  }
  82%{
    opacity:.22;
  }
  100%{
    transform:translateY(-240px) scale(1.15);
    opacity:0;
  }
}

/* =====================================
   PAGE
===================================== */

.page{
  width:100%;
  max-width:500px;
  margin:0 auto;
  padding:14px 12px 32px;
  position:relative;
  z-index:5;
}

/* =====================================
   HEADER
===================================== */

.logo{
  text-align:center;
  margin-bottom:6px;
}

.logo img{
  width:208px;
  max-width:72%;
  height:auto;
  filter:drop-shadow(0 5px 12px rgba(0,0,0,.45));
}

.title{
  text-align:center;
  margin-bottom:12px;
}

.title small{
  display:block;
  color:#b4c4d8;
  font-size:9px;
  letter-spacing:3px;
  font-weight:bold;
  text-shadow:0 2px 4px rgba(0,0,0,.7);
}

.title h1{
  margin:4px 0;
  color:#ffd763;
  font-size:30px;
  line-height:1;
  text-shadow:
    0 2px 0 #714903,
    0 0 18px rgba(255,202,50,.40),
    0 6px 12px rgba(0,0,0,.60);
}

.title p{
  margin:6px 0 0;
  color:#e1e7ee;
  font-size:9px;
  letter-spacing:1.5px;
  text-shadow:0 2px 4px rgba(0,0,0,.7);
}

/* =====================================
   STATUS
===================================== */

.status-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-bottom:10px;
}

.status-box{
  padding:9px 8px;
  text-align:center;
  border-radius:12px;
  border:1px solid rgba(217,173,53,.70);
  background:
    linear-gradient(180deg, rgba(8,28,49,.88), rgba(3,11,20,.94));
  backdrop-filter:blur(7px);
  box-shadow:
    0 8px 20px rgba(0,0,0,.25),
    inset 0 0 14px rgba(255,208,79,.04);
}

.status-box span{
  display:block;
  font-size:8px;
  color:#93a4b8;
  letter-spacing:1px;
}

.status-box strong{
  display:block;
  margin-top:4px;
  color:#ffd75e;
  font-size:14px;
}

/* =====================================
   MACHINE STAGE
===================================== */

.machine-stage{
  position:relative;
  margin-top:2px;
  margin-bottom:12px;
  padding-bottom:78px;
}

.machine-wrap{
  position:relative;
  width:106%;
  margin-left:-3%;
  aspect-ratio:3 / 4.05;
  z-index:5;
  filter:
    drop-shadow(0 24px 34px rgba(0,0,0,.55))
    drop-shadow(0 0 34px rgba(31,125,255,.12));
}

.machine-floor-glow{
  position:absolute;
  left:50%;
  bottom:28px;
  width:78%;
  height:72px;
  transform:translateX(-50%);
  border-radius:50%;
  z-index:1;
  background:
    radial-gradient(ellipse,
      rgba(49,145,255,.20) 0%,
      rgba(255,199,70,.10) 38%,
      rgba(255,255,255,.03) 50%,
      transparent 76%);
  filter:blur(16px);
}

.machine-floor-shine{
  position:absolute;
  left:50%;
  bottom:18px;
  width:86%;
  height:38px;
  transform:translateX(-50%);
  border-radius:50%;
  z-index:2;
  background:
    linear-gradient(90deg,
      transparent 0%,
      rgba(121,188,255,.10) 18%,
      rgba(255,255,255,.22) 50%,
      rgba(255,211,96,.10) 82%,
      transparent 100%);
  filter:blur(10px);
  opacity:.7;
}

.machine-reflection{
  position:absolute;
  left:50%;
  bottom:-40px;
  width:94%;
  transform:translateX(-50%) scaleY(-1);
  z-index:0;
  opacity:.14;
  filter:blur(5px);
  pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,.18), transparent 72%);
  mask-image:linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,.18), transparent 72%);
}

.machine-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:1;
  pointer-events:none;
}

/* =====================================
   GAME GLASS
===================================== */

.game-glass{
  position:absolute;
  left:15.4%;
  right:15.4%;
  top:15.7%;
  bottom:34.1%;
  z-index:5;
  overflow:hidden;
  border-radius:10px;
  background:
    radial-gradient(circle at 50% 25%,
      rgba(18,85,152,.98) 0%,
      rgba(8,44,82,.98) 38%,
      rgba(3,22,41,.98) 72%,
      rgba(2,11,21,.98) 100%);
  box-shadow:
    inset 0 0 30px rgba(0,145,255,.26),
    inset 0 -48px 68px rgba(0,0,0,.34);
}

.game-glass::before{
  content:"";
  position:absolute;
  left:-12%;
  top:0;
  width:46%;
  height:100%;
  background:
    linear-gradient(105deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.04) 34%,
      transparent 56%);
  filter:blur(2px);
  z-index:18;
  pointer-events:none;
}

.game-glass::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:60;
  pointer-events:none;
  background:
    linear-gradient(112deg,
      rgba(255,255,255,.08),
      transparent 25%,
      transparent 72%,
      rgba(255,255,255,.025));
}

/* =====================================
   MACHINE LIGHTS
===================================== */

.lights{
  position:absolute;
  top:4.5%;
  left:12%;
  right:12%;
  display:flex;
  justify-content:space-between;
  z-index:8;
}

.light{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#69c2ff;
  box-shadow:
    0 0 8px #69c2ff,
    0 0 16px #278fff;
  animation:insideLight 1.8s ease-in-out infinite;
}

.light:nth-child(2){ animation-delay:.5s; }
.light:nth-child(3){ animation-delay:1s; }

@keyframes insideLight{
  0%,100%{ opacity:.55; }
  50%{ opacity:1; }
}

/* =====================================
   FLOOR INSIDE GLASS
===================================== */

.inner-floor-glow{
  position:absolute;
  left:8%;
  right:8%;
  bottom:5%;
  height:18px;
  z-index:9;
  border-radius:50%;
  background:
    radial-gradient(ellipse,
      rgba(121,195,255,.22) 0%,
      rgba(255,210,92,.08) 48%,
      transparent 75%);
  filter:blur(6px);
  opacity:.85;
}

/* =====================================
   RAIL
===================================== */

.rail{
  position:absolute;
  top:9%;
  left:7%;
  right:7%;
  height:6px;
  border-radius:20px;
  z-index:10;
  background:
    linear-gradient(180deg, #ffe886, #c48b16);
  box-shadow:0 0 10px rgba(255,211,66,.55);
}

/* =====================================
   CLAW
===================================== */

.claw-system{
  position:absolute;
  left:50%;
  top:5.5%;
  width:110px;
  transform:translateX(-50%);
  z-index:40;
  transition:left .28s ease;
  pointer-events:none;
}

.carriage{
  width:42px;
  height:23px;
  margin:0 auto;
  border-radius:6px;
  background:
    linear-gradient(180deg, #ffeb86, #aa7310);
  border:2px solid #ffe989;
  box-shadow:0 0 10px rgba(255,210,55,.42);
}

.cable{
  width:4px;
  height:42px;
  margin:0 auto;
  background:
    linear-gradient(90deg, #393939, #d8d8d8, #434343);
  transition:height .75s cubic-bezier(.4,0,.2,1);
}

.claw-holder{
  width:100px;
  margin:0 auto;
  position:relative;
}

.claw-img{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
  filter:drop-shadow(0 7px 9px rgba(0,0,0,.60));
}

.caught{
  position:absolute;
  left:50%;
  bottom:-28px;
  transform:translateX(-50%);
  width:48px;
  height:48px;
  object-fit:contain;
  display:none;
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.60));
}

.claw-holder.has-prize .caught{
  display:block;
}

/* =====================================
   PRIZE FLOOR
===================================== */

.prize-floor{
  position:absolute;
  left:4%;
  right:4%;
  bottom:.5%;
  height:32%;
  z-index:20;
}

.ball{
  position:absolute;
  width:21%;
  aspect-ratio:1;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1.5px solid rgba(255,255,255,.38);
  background:
    radial-gradient(circle at 30% 22%,
      rgba(255,255,255,.55),
      rgba(57,128,205,.15) 34%,
      rgba(4,13,26,.18) 70%);
  box-shadow:
    inset 0 0 15px rgba(255,255,255,.16),
    0 7px 14px rgba(0,0,0,.42);
  animation:floatBall 3s ease-in-out infinite;
  transition:opacity .3s, filter .3s;
}

.ball img{
  width:78%;
  height:78%;
  object-fit:contain;
  pointer-events:none;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));
}

@keyframes floatBall{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-3px); }
}

/* posisi hadiah */
.b1{ left:0; bottom:0; }
.b2{ left:20%; bottom:17%; }
.b3{ left:40%; bottom:0; }
.b4{ right:20%; bottom:18%; }
.b5{ right:0; bottom:0; }

.b6{
  left:50%;
  bottom:40%;
  width:23%;
  transform:translateX(-50%);
  animation:none;
  background:
    radial-gradient(circle at 32% 22%,
      #fff3ad,
      rgba(255,194,39,.5) 40%,
      rgba(125,71,0,.27) 75%);
  box-shadow:
    0 0 26px rgba(255,198,39,.7),
    inset 0 0 15px rgba(255,255,255,.32);
}

.b7{
  left:4%;
  bottom:31%;
  width:18%;
}

.b8{
  right:4%;
  bottom:31%;
  width:18%;
}

.ball.winner{
  filter:brightness(1.25);
  border-color:#ffe66f;
  box-shadow:
    0 0 32px rgba(255,205,50,1),
    inset 0 0 16px rgba(255,255,255,.4);
}

/* =====================================
   CONTROL
===================================== */

.control{
  margin-top:2px;
  padding:10px;
  border-radius:15px;
  border:1px solid rgba(217,174,52,.72);
  background:
    linear-gradient(180deg,
      rgba(10,27,47,.89),
      rgba(3,9,17,.95));
  backdrop-filter:blur(9px);
  box-shadow:
    0 12px 30px rgba(0,0,0,.40),
    0 0 18px rgba(255,198,45,.07);
}

.buttons{
  display:grid;
  grid-template-columns:68px 1fr 68px;
  gap:8px;
}

button{
  height:49px;
  border-radius:11px;
  border:1px solid #b78d24;
  background:
    linear-gradient(180deg, #10233c, #071323);
  color:#ffd75e;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.40;
}

.grab{
  font-size:14px;
  color:#07101a;
  background:
    linear-gradient(180deg, #fff09b, #f1cb52 46%, #c58b14 100%);
  box-shadow:
    0 0 12px rgba(255,207,61,.25),
    inset 0 1px 0 rgba(255,255,255,.60);
}

.message{
  min-height:40px;
  padding-top:9px;
  text-align:center;
  font-size:10px;
  line-height:1.5;
  color:#d0d7df;
}

.claim{
  display:none;
  margin-top:8px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  text-decoration:none;
  color:#07101a;
  font-size:12px;
  font-weight:bold;
  background:
    linear-gradient(90deg, #855d07, #f7d462, #855d07);
}

/* =====================================
   MODAL
===================================== */

.modal{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.84);
  backdrop-filter:blur(7px);
}

.modal-box{
  width:100%;
  max-width:330px;
  padding:22px 17px 17px;
  text-align:center;
  border-radius:20px;
  border:2px solid #d7aa34;
  background:
    radial-gradient(circle at top, #173e70, #07111f 60%);
  box-shadow:0 0 40px rgba(255,196,43,.24);
}

.reward-image{
  width:115px;
  height:115px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#0a2340;
  border:1px solid #84671a;
  box-shadow:0 0 24px rgba(255,200,50,.14);
}

.reward-image img{
  width:100px;
  height:100px;
  object-fit:contain;
}

.modal h2{
  color:#ffd65d;
  margin:10px 0 5px;
}

.reward-name{
  font-size:18px;
  font-weight:bold;
  margin:9px 0 5px;
}

.reward-desc{
  font-size:10px;
  line-height:1.5;
  color:#bdc7d4;
}

.modal-claim{
  display:block;
  margin-top:14px;
  padding:12px;
  border-radius:9px;
  text-decoration:none;
  font-size:11px;
  font-weight:bold;
  color:#07101a;
  background:
    linear-gradient(90deg, #875f08, #f7d35e, #875f08);
}

.footer{
  text-align:center;
  padding-top:12px;
  color:#7a8b9e;
  font-size:8px;
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:370px){
  .title h1{
    font-size:25px;
  }

  .buttons{
    grid-template-columns:58px 1fr 58px;
  }

  .claw-system{
    width:100px;
  }

  .machine-stage{
    padding-bottom:64px;
  }

  .machine-floor-glow{
    width:82%;
  }
}
</style>
</head>
<body>

<div class="scene-fx">
  <div class="scene-vignette"></div>
  <div class="top-ambient"></div>
  <div class="side-light side-left"></div>
  <div class="side-light side-right"></div>
  <div class="spotlight spot-left"></div>
  <div class="spotlight spot-center"></div>
  <div class="spotlight spot-right"></div>
  <div class="light-sweep"></div>

  <div class="particles">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
  </div>
</div>

<div class="page">

  <div class="logo">
    <img src="assets/logo-mauslot.png" alt="MAUSLOT">
  </div>

  <div class="title">
    <small>EVENT SPECIAL</small>
    <h1>9.9 CLAW MACHINE</h1>
    <p>GRAB IT • WIN IT • CLAIM IT</p>
  </div>

  <div class="status-row">
    <div class="status-box">
      <span>TIKET BERMAIN</span>
      <strong id="ticket">1</strong>
    </div>

    <div class="status-box">
      <span>STATUS</span>
      <strong id="status">SIAP MAIN</strong>
    </div>
  </div>

  <div class="machine-stage">
    <div class="machine-floor-glow"></div>
    <div class="machine-floor-shine"></div>
    <img class="machine-reflection" src="assets/claw%20machine.png" alt="">

    <div class="machine-wrap">
      <img class="machine-frame" src="assets/claw%20machine.png" alt="">

      <div class="game-glass" id="gameGlass">
        <div class="lights">
          <div class="light"></div>
          <div class="light"></div>
          <div class="light"></div>
        </div>

        <div class="rail"></div>
        <div class="inner-floor-glow"></div>

        <div class="claw-system" id="clawSystem">
          <div class="carriage"></div>
          <div class="cable" id="cable"></div>

          <div class="claw-holder" id="clawHolder">
            <img class="claw-img" id="clawImage" src="assets/claw%20open.png" alt="">
            <img class="caught" id="caughtPrize" src="" alt="">
          </div>
        </div>

        <div class="prize-floor">
          <div class="ball b1" data-id="0"><img src="assets/coin.png" alt=""></div>
          <div class="ball b2" data-id="1"><img src="assets/gift.png" alt=""></div>
          <div class="ball b3" data-id="2"><img src="assets/diamond.png" alt=""></div>
          <div class="ball b4" data-id="3"><img src="assets/crown.png" alt=""></div>
          <div class="ball b5" data-id="4"><img src="assets/chip.png" alt=""></div>
          <div class="ball b6" data-id="5"><img src="assets/grand%20prize.png" alt=""></div>
          <div class="ball b7" data-id="6"><img src="assets/ticket.png" alt=""></div>
          <div class="ball b8" data-id="7"><img src="assets/mystery.png" alt=""></div>
        </div>
      </div>
    </div>
  </div>

  <div class="control">
    <div class="buttons">
      <button id="leftButton" onclick="moveLeft()">◀</button>
      <button class="grab" id="grabButton" onclick="grabPrize()">🎯 GRAB</button>
      <button id="rightButton" onclick="moveRight()">▶</button>
    </div>

    <div class="message" id="message">
      Gerakkan capit ke hadiah pilihan lalu tekan <b>GRAB</b>.
    </div>

    <a href="https://mauslot.life/" id="claimButton" class="claim">🎁 CLAIM HADIAH</a>
  </div>

  <div class="footer">
    MAUSLOT VIP • EVENT SPECIAL 9.9
  </div>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="reward-image">
      <img id="resultImage" src="assets/gift.png" alt="">
    </div>

    <h2>SELAMAT!</h2>

    <div class="reward-name" id="resultName">VIP REWARD</div>
    <div class="reward-desc" id="resultDesc">Hadiah berhasil didapatkan.</div>

    <a href="https://mauslot.life/" class="modal-claim">🎁 CLAIM HADIAH</a>
  </div>
</div>

<script>
const prizes = [
  {
    name:"BONUS SALDO",
    image:"assets/coin.png",
    description:"Bonus saldo spesial Event 9.9."
  },
  {
    name:"VIP GIFT",
    image:"assets/gift.png",
    description:"Hadiah VIP spesial berhasil didapatkan."
  },
  {
    name:"DIAMOND REWARD",
    image:"assets/diamond.png",
    description:"Diamond Reward spesial MAUSLOT."
  },
  {
    name:"CROWN REWARD",
    image:"assets/crown.png",
    description:"Crown Reward spesial Event 9.9."
  },
  {
    name:"VIP POINT",
    image:"assets/chip.png",
    description:"Tambahan VIP Point berhasil didapatkan."
  },
  {
    name:"GRAND PRIZE",
    image:"assets/grand%20prize.png",
    description:"Grand Prize spesial MAUSLOT 9.9."
  },
  {
    name:"VIP TICKET",
    image:"assets/ticket.png",
    description:"VIP Ticket berhasil didapatkan."
  },
  {
    name:"MYSTERY REWARD",
    image:"assets/mystery.png",
    description:"Mystery Reward berhasil didapatkan."
  }
];

let ticket = 1;
let position = 50;
let playing = false;

const gameGlass = document.getElementById("gameGlass");
const clawSystem = document.getElementById("clawSystem");
const cable = document.getElementById("cable");
const clawHolder = document.getElementById("clawHolder");
const clawImage = document.getElementById("clawImage");
const caughtPrize = document.getElementById("caughtPrize");
const statusText = document.getElementById("status");
const ticketText = document.getElementById("ticket");
const message = document.getElementById("message");
const leftButton = document.getElementById("leftButton");
const rightButton = document.getElementById("rightButton");
const grabButton = document.getElementById("grabButton");

function updatePosition(){
  clawSystem.style.left = position + "%";
}

function moveLeft(){
  if(playing) return;

  position -= 8;
  if(position < 12) position = 12;

  updatePosition();
  message.innerHTML = "Capit bergerak ke kiri.";
}

function moveRight(){
  if(playing) return;

  position += 8;
  if(position > 88) position = 88;

  updatePosition();
  message.innerHTML = "Capit bergerak ke kanan.";
}

function getPrizeCenter(element){
  const glassRect = gameGlass.getBoundingClientRect();
  const prizeRect = element.getBoundingClientRect();

  return {
    x: (prizeRect.left - glassRect.left) + (prizeRect.width / 2),
    y: (prizeRect.top - glassRect.top) + (prizeRect.height / 2)
  };
}

function findClosestPrize(){
  const balls = document.querySelectorAll(".ball");
  const glassRect = gameGlass.getBoundingClientRect();
  const targetX = glassRect.width * (position / 100);

  let winner = 0;
  let smallest = Infinity;

  balls.forEach((ball,index)=>{
    if(ball.style.opacity === "0") return;

    const center = getPrizeCenter(ball);
    const distance = Math.abs(center.x - targetX);

    if(distance < smallest){
      smallest = distance;
      winner = index;
    }
  });

  return winner;
}

function moveToPrize(prizeElement){
  const glassRect = gameGlass.getBoundingClientRect();
  const center = getPrizeCenter(prizeElement);

  const percentage = (center.x / glassRect.width) * 100;

  position = Math.max(12, Math.min(88, percentage));
  updatePosition();
}

function calculateDrop(prizeElement){
  const glassRect = gameGlass.getBoundingClientRect();
  const prizeRect = prizeElement.getBoundingClientRect();
  const clawRect = clawImage.getBoundingClientRect();

  const prizeCenterY = (prizeRect.top - glassRect.top) + (prizeRect.height / 2);
  const clawBottom = clawRect.bottom - glassRect.top;

  const targetY = prizeCenterY - (prizeRect.height * .10);

  let drop = targetY - clawBottom;
  if(drop < 0) drop = 0;

  const maxDrop = glassRect.height * .60;
  if(drop > maxDrop) drop = maxDrop;

  return 42 + drop;
}

function lockControls(){
  leftButton.disabled = true;
  rightButton.disabled = true;
  grabButton.disabled = true;
}

function unlockControls(){
  leftButton.disabled = false;
  rightButton.disabled = false;
  grabButton.disabled = false;
}

async function grabPrize(){
  if(playing) return;

  if(ticket <= 0){
    message.innerHTML = "Tiket bermain sudah habis.";
    return;
  }

  playing = true;
  lockControls();

  clawImage.src = "assets/claw%20open.png";
  clawHolder.classList.remove("has-prize");
  caughtPrize.src = "";

  const winnerIndex = findClosestPrize();
  const prize = prizes[winnerIndex];
  const prizeElement = document.querySelector(`.ball[data-id="${winnerIndex}"]`);

  statusText.innerHTML = "MENUJU HADIAH";
  message.innerHTML = "Capit sedang menuju hadiah...";

  moveToPrize(prizeElement);
  await wait(500);

  const dropHeight = calculateDrop(prizeElement);

  statusText.innerHTML = "GRABBING";
  message.innerHTML = "Capit sedang turun...";

  cable.style.height = dropHeight + "px";
  await wait(800);

  clawImage.src = "assets/claw%20close.png";
  prizeElement.classList.add("winner");
  await wait(350);

  caughtPrize.src = prize.image;
  clawHolder.classList.add("has-prize");
  prizeElement.style.opacity = "0";
  await wait(350);

  statusText.innerHTML = "MENGANGKAT";
  message.innerHTML = "Hadiah berhasil tercapit...";

  cable.style.height = "42px";
  await wait(900);

  ticket--;
  ticketText.innerHTML = ticket;

  showResult(prize);

  statusText.innerHTML = "BERHASIL";
  message.innerHTML = "🎉 Hadiah berhasil didapatkan.";

  document.getElementById("claimButton").style.display = "block";

  if(ticket > 0){
    unlockControls();
  }

  playing = false;
}

function showResult(prize){
  document.getElementById("resultImage").src = prize.image;
  document.getElementById("resultName").innerHTML = prize.name;
  document.getElementById("resultDesc").innerHTML = prize.description;
  document.getElementById("modal").style.display = "flex";
}

function wait(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

document.getElementById("modal").addEventListener("click", function(e){
  if(e.target === this){
    this.style.display = "none";
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "ArrowLeft") moveLeft();
  if(e.key === "ArrowRight") moveRight();
  if(e.key === "Enter") grabPrize();
});
</script>

</body>
</html>
