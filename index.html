<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020713">

<title>MAUSLOT 9.9 Claw Machine</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 0%,#173f72,#071426 38%,#01040a 100%);
}

.page{
  width:100%;
  max-width:470px;
  margin:0 auto;
  padding:12px 10px 30px;
}

/* =========================
   HEADER
========================= */

.logo{
  text-align:center;
  margin-bottom:5px;
}

.logo img{
  width:205px;
  max-width:70%;
  height:auto;
}

.title{
  text-align:center;
  margin-bottom:10px;
}

.title small{
  display:block;
  color:#91a4ba;
  font-size:9px;
  letter-spacing:3px;
  font-weight:bold;
}

.title h1{
  margin:4px 0;
  color:#ffd563;
  font-size:29px;
  line-height:1;
  text-shadow:
    0 2px 0 #714a04,
    0 0 16px rgba(255,202,50,.35);
}

.title p{
  margin:6px 0 0;
  color:#ccd5e0;
  font-size:9px;
  letter-spacing:1.4px;
}

/* =========================
   STATUS
========================= */

.status-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.status-box{
  padding:8px;
  text-align:center;
  border-radius:10px;
  border:1px solid #765b19;
  background:#071526;
}

.status-box span{
  display:block;
  font-size:8px;
  color:#8292a6;
  letter-spacing:1px;
}

.status-box strong{
  display:block;
  margin-top:3px;
  color:#ffd75d;
  font-size:14px;
}

/* =========================
   MACHINE
========================= */

.machine-wrap{
  position:relative;
  width:100%;
  aspect-ratio:3 / 4.05;
}

.machine-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:1;
  pointer-events:none;
  filter:drop-shadow(0 15px 25px rgba(0,0,0,.55));
}

/* interior game */

.game-glass{
  position:absolute;

  left:15.4%;
  right:15.4%;
  top:15.7%;
  bottom:34.1%;

  z-index:5;

  overflow:hidden;

  border-radius:10px;

  background:
    radial-gradient(
      circle at 50% 24%,
      #0d457e 0%,
      #082d55 35%,
      #051d38 68%,
      #031325 100%
    );

  box-shadow:
    inset 0 0 25px rgba(0,139,255,.32),
    inset 0 -35px 55px rgba(0,0,0,.35);
}

.game-glass:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:60;
  pointer-events:none;

  background:
    linear-gradient(
      115deg,
      rgba(255,255,255,.06),
      transparent 28%,
      transparent 72%,
      rgba(255,255,255,.025)
    );
}

/* =========================
   LIGHT
========================= */

.lights{
  position:absolute;
  top:4.5%;
  left:12%;
  right:12%;
  display:flex;
  justify-content:space-between;
  z-index:8;
}

.light{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#55b8ff;
  box-shadow:
    0 0 8px #42a8ff,
    0 0 14px #278eff;
}

/* =========================
   RAIL
========================= */

.rail{
  position:absolute;
  top:9%;
  left:7%;
  right:7%;
  height:6px;
  border-radius:20px;
  z-index:10;

  background:
    linear-gradient(
      180deg,
      #ffe178,
      #bc7f13
    );

  box-shadow:
    0 0 10px rgba(255,210,65,.55);
}

/* =========================
   CLAW SYSTEM
========================= */

.claw-system{
  position:absolute;

  left:50%;
  top:5.5%;

  width:110px;

  transform:translateX(-50%);

  z-index:40;

  transition:left .28s ease;

  pointer-events:none;
}

.carriage{
  width:42px;
  height:23px;
  margin:0 auto;

  border-radius:6px;

  background:
    linear-gradient(
      180deg,
      #ffe57a,
      #a46d0d
    );

  border:2px solid #ffe783;

  box-shadow:
    0 0 8px rgba(255,208,54,.45);
}

.cable{
  width:4px;

  /* posisi awal */
  height:42px;

  margin:0 auto;

  background:
    linear-gradient(
      90deg,
      #383838,
      #d5d5d5,
      #474747
    );

  transition:
    height .75s cubic-bezier(.4,0,.2,1);
}

.claw-holder{
  width:100px;
  margin:0 auto;
  position:relative;
}

.claw-img{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;

  filter:
    drop-shadow(0 6px 8px rgba(0,0,0,.55));
}

/* hadiah ikut claw */

.caught{
  position:absolute;
  left:50%;
  bottom:-28px;

  transform:translateX(-50%);

  width:48px;
  height:48px;

  object-fit:contain;

  display:none;

  filter:
    drop-shadow(0 5px 7px rgba(0,0,0,.55));
}

.claw-holder.has-prize .caught{
  display:block;
}

/* =========================
   PRIZE FLOOR
========================= */

.prize-floor{
  position:absolute;

  left:4%;
  right:4%;

  bottom:0.5%;

  height:32%;

  z-index:20;
}

/* =========================
   BALL
========================= */

.ball{
  position:absolute;

  width:21%;
  aspect-ratio:1;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1.5px solid rgba(255,255,255,.38);

  background:
    radial-gradient(
      circle at 30% 22%,
      rgba(255,255,255,.55),
      rgba(57,128,205,.15) 34%,
      rgba(4,13,26,.18) 70%
    );

  box-shadow:
    inset 0 0 15px rgba(255,255,255,.16),
    0 7px 14px rgba(0,0,0,.42);

  animation:
    floatBall 3s ease-in-out infinite;

  transition:
    opacity .3s,
    filter .3s;
}

.ball img{
  width:78%;
  height:78%;
  object-fit:contain;
  pointer-events:none;

  filter:
    drop-shadow(0 3px 5px rgba(0,0,0,.35));
}

@keyframes floatBall{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-3px);
  }
}

/* =========================
   POSISI HADIAH
========================= */

.b1{
  left:0;
  bottom:0;
}

.b2{
  left:20%;
  bottom:17%;
}

.b3{
  left:40%;
  bottom:0;
}

.b4{
  right:20%;
  bottom:18%;
}

.b5{
  right:0;
  bottom:0;
}

.b6{
  left:50%;
  bottom:40%;

  width:23%;

  transform:translateX(-50%);

  animation:none;

  background:
    radial-gradient(
      circle at 32% 22%,
      #fff3ad,
      rgba(255,194,39,.5) 40%,
      rgba(125,71,0,.27) 75%
    );

  box-shadow:
    0 0 26px rgba(255,198,39,.7),
    inset 0 0 15px rgba(255,255,255,.32);
}

.b7{
  left:4%;
  bottom:31%;
  width:18%;
}

.b8{
  right:4%;
  bottom:31%;
  width:18%;
}

.ball.winner{
  filter:brightness(1.25);

  border-color:#ffe66f;

  box-shadow:
    0 0 32px rgba(255,205,50,1),
    inset 0 0 16px rgba(255,255,255,.4);
}

/* =========================
   CONTROL
========================= */

.control{
  margin-top:8px;

  padding:10px;

  border-radius:14px;

  border:1px solid #705719;

  background:
    linear-gradient(
      180deg,
      #0b1a2c,
      #050b12
    );
}

.buttons{
  display:grid;

  grid-template-columns:
    68px 1fr 68px;

  gap:8px;
}

button{
  height:49px;

  border-radius:11px;

  border:1px solid #b58b21;

  background:#0d1c30;

  color:#ffd55b;

  font-size:20px;

  font-weight:bold;

  cursor:pointer;

  touch-action:manipulation;
}

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.4;
}

.grab{
  font-size:14px;

  color:#07101a;

  background:
    linear-gradient(
      180deg,
      #ffe984,
      #d6a126
    );
}

.message{
  min-height:40px;

  padding-top:9px;

  text-align:center;

  font-size:10px;

  line-height:1.5;

  color:#c4ccd7;
}

/* =========================
   CLAIM
========================= */

.claim{
  display:none;

  margin-top:8px;

  padding:12px;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      #875f08,
      #f6d25f,
      #875f08
    );

  text-align:center;

  text-decoration:none;

  color:#07101a;

  font-size:12px;

  font-weight:bold;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  z-index:9999;

  display:none;

  align-items:center;
  justify-content:center;

  padding:18px;

  background:
    rgba(0,0,0,.85);
}

.modal-box{
  width:100%;

  max-width:330px;

  padding:22px 17px 17px;

  text-align:center;

  border-radius:20px;

  border:2px solid #d7aa34;

  background:
    radial-gradient(
      circle at top,
      #173e70,
      #07111f 60%
    );
}

.reward-image{
  width:115px;
  height:115px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#0a2340;

  border:1px solid #84671a;
}

.reward-image img{
  width:100px;
  height:100px;
  object-fit:contain;
}

.modal h2{
  color:#ffd65d;
  margin:10px 0 5px;
}

.reward-name{
  font-size:18px;
  font-weight:bold;
  margin:9px 0 5px;
}

.reward-desc{
  font-size:10px;
  line-height:1.5;
  color:#bdc7d4;
}

.modal-claim{
  display:block;

  margin-top:14px;

  padding:12px;

  border-radius:9px;

  text-decoration:none;

  font-size:11px;

  font-weight:bold;

  color:#07101a;

  background:
    linear-gradient(
      90deg,
      #875f08,
      #f7d35e,
      #875f08
    );
}

.footer{
  text-align:center;
  padding-top:12px;
  color:#607085;
  font-size:8px;
}

@media(max-width:370px){

  .title h1{
    font-size:25px;
  }

  .buttons{
    grid-template-columns:
      58px 1fr 58px;
  }

  .claw-system{
    width:100px;
  }

}
</style>
</head>


<body>

<div class="page">

  <div class="logo">

  <div class="title">

  <!-- STATUS -->

        <div
          class="ball b3"

          <img

        <div
          class="ball b4"
          data-id="3">

          <img
            src="assets/crown.png">

        </div>


        <div
          class="ball b5"
          data-id="4">

          <img
            src="assets/chip.png">

        <div
          class="ball b6"
          data-id="5">

          <img

</div>



<!-- MODAL -->

<div
  class="modal"
  id="modal">

    </h2>

      id="resultName">

      id="resultDesc">

      Hadiah berhasil didapatkan.

    </div>


    <a
      href="https://mauslot.life/"
      class="modal-claim">

      🎁 CLAIM HADIAH

    </a>


  </div>

</div>



<script>

/* =============================
   DATA HADIAH
============================= */

const prizes = [

  {
    name:"BONUS SALDO",
    image:"assets/coin.png",
    description:"Bonus saldo spesial Event 9.9."
  },

  {
    name:"VIP GIFT",
    image:"assets/gift.png",
    description:"Hadiah VIP spesial berhasil didapatkan."
  },

  {
    name:"DIAMOND REWARD",
    image:"assets/diamond.png",
    description:"Diamond Reward spesial MAUSLOT."
  },

  {
    name:"CROWN REWARD",
    image:"assets/crown.png",
    description:"Crown Reward spesial Event 9.9."
  },

  {
    name:"VIP POINT",
    image:"assets/chip.png",
    description:"Tambahan VIP Point berhasil didapatkan."
  },

  {
    name:"GRAND PRIZE",
    image:"assets/grand%20prize.png",
    description:"Grand Prize spesial MAUSLOT 9.9."
  },

  {
    name:"VIP TICKET",
    image:"assets/ticket.png",
    description:"VIP Ticket berhasil didapatkan."
  },

  {
    name:"MYSTERY REWARD",
    image:"assets/mystery.png",
    description:"Mystery Reward berhasil didapatkan."
  }

];


/* =============================
   STATE
============================= */

let ticket = 1;

let position = 50;

let playing = false;


/* =============================
   ELEMENTS
============================= */

const gameGlass =
document.getElementById(
  "gameGlass"
);

const clawSystem =
document.getElementById(
  "clawSystem"
);

const cable =
document.getElementById(
  "cable"
);

const clawHolder =
document.getElementById(
  "clawHolder"
);

const clawImage =
document.getElementById(
  "clawImage"
);

const caughtPrize =
document.getElementById(
  "caughtPrize"
);

const statusText =
document.getElementById(
  "status"
);

const ticketText =
document.getElementById(
  "ticket"
);

const message =
document.getElementById(
  "message"
);

const leftButton =
document.getElementById(
  "leftButton"
);

const rightButton =
document.getElementById(
  "rightButton"
);

const grabButton =
document.getElementById(
  "grabButton"
);


/* =============================
   POSITION
============================= */

function updatePosition(){

  clawSystem.style.left =
  position + "%";

}


/* =============================
   LEFT
============================= */

function moveLeft(){

  if(playing){
    return;
  }


  position -= 8;


  if(position < 12){

    position = 12;

  }


  updatePosition();


  message.innerHTML =
  "Capit bergerak ke kiri.";

}


/* =============================
   RIGHT
============================= */

function moveRight(){

  if(playing){
    return;
  }


  position += 8;


  if(position > 88){

    position = 88;

  }


  updatePosition();


  message.innerHTML =
  "Capit bergerak ke kanan.";

}


/* =============================
   GET PRIZE CENTER
============================= */

function getPrizeCenter(element){

  const glassRect =
  gameGlass.getBoundingClientRect();

  const prizeRect =
  element.getBoundingClientRect();


  return {

    x:
      (
        prizeRect.left -
        glassRect.left
      )
      +
      (
        prizeRect.width / 2
      ),

    y:
      (
        prizeRect.top -
        glassRect.top
      )
      +
      (
        prizeRect.height / 2
      )

  };

}


/* =============================
   CLAW CENTER
============================= */

function getClawCenter(){

  const glassRect =
  gameGlass.getBoundingClientRect();

  const holderRect =
  clawHolder.getBoundingClientRect();


  return {

    x:
      (
        holderRect.left -
        glassRect.left
      )
      +
      (
        holderRect.width / 2
      ),

    y:
      (
        holderRect.top -
        glassRect.top
      )
      +
      (
        holderRect.height / 2
      )

  };

}


/* =============================
   NEAREST PRIZE
============================= */

function findClosestPrize(){

  const balls =
  document.querySelectorAll(
    ".ball"
  );


  const glassRect =
  gameGlass.getBoundingClientRect();


  const targetX =
  glassRect.width *
  (
    position / 100
  );


  let winner = 0;

  let smallestDistance =
  Infinity;


  balls.forEach(
    (ball,index)=>{


      if(
        ball.style.opacity ===
        "0"
      ){
        return;
      }


      const center =
      getPrizeCenter(
        ball
      );


      const distance =
      Math.abs(
        center.x -
        targetX
      );


      if(
        distance <
        smallestDistance
      ){

        smallestDistance =
        distance;

        winner =
        index;

      }

    }
  );


  return winner;

}


/* =============================
   MOVE X PRECISE
============================= */

function moveToPrize(
  prizeElement
){

  const glassRect =
  gameGlass.getBoundingClientRect();


  const prizeCenter =
  getPrizeCenter(
    prizeElement
  );


  const percent =
  (
    prizeCenter.x /
    glassRect.width
  )
  *
  100;


  position =
  Math.max(
    12,
    Math.min(
      88,
      percent
    )
  );


  updatePosition();

}


/* =============================
   CALCULATE DROP
============================= */

function calculateDrop(
  prizeElement
){

  /*
  Hitung posisi bola terhadap
  area game.
  */

  const glassRect =
  gameGlass.getBoundingClientRect();


  const prizeRect =
  prizeElement.getBoundingClientRect();


  const clawImageRect =
  clawImage.getBoundingClientRect();


  /*
  Y pusat hadiah
  */

  const prizeCenterY =
  (
    prizeRect.top -
    glassRect.top
  )
  +
  (
    prizeRect.height / 2
  );


  /*
  Posisi bawah claw pada
  keadaan awal.
  */

  const initialClawBottom =
  (
    clawImageRect.bottom -
    glassRect.top
  );


  /*
  Kita ingin ujung claw
  masuk sedikit ke bagian
  atas bola agar terlihat
  benar-benar menjepit.
  */

  const grabTargetY =
  prizeCenterY -
  (
    prizeRect.height *
    0.08
  );


  let extraDrop =
  grabTargetY -
  initialClawBottom;


  /*
  Jangan sampai negatif.
  */

  if(extraDrop < 0){

    extraDrop = 0;

  }


  /*
  Batas agar kabel tidak
  keluar area kaca.
  */

  const maxDrop =
  glassRect.height *
  0.62;


  if(extraDrop > maxDrop){

    extraDrop =
    maxDrop;

  }


  /*
  Cable awal 42px.
  */

  return 42 + extraDrop;

}


/* =============================
   CONTROL LOCK
============================= */

function lockControls(){

  leftButton.disabled = true;

  rightButton.disabled = true;

  grabButton.disabled = true;

}


function unlockControls(){

  leftButton.disabled = false;

  rightButton.disabled = false;

  grabButton.disabled = false;

}


/* =============================
   GRAB
============================= */

async function grabPrize(){

  if(playing){
    return;
  }


  if(ticket <= 0){

    message.innerHTML =
    "Tiket bermain sudah habis.";

    return;

  }


  playing = true;


  lockControls();


  /*
  Pastikan claw kembali terbuka.
  */

  clawImage.src =
  "assets/claw%20open.png";


  const winnerIndex =
  findClosestPrize();


  const prize =
  prizes[winnerIndex];


  const prizeElement =
  document.querySelector(
    `.ball[data-id="${winnerIndex}"]`
  );


  /*
  Gerak horizontal tepat
  di tengah bola.
  */

  statusText.innerHTML =
  "MENUJU HADIAH";


  moveToPrize(
    prizeElement
  );


  await wait(500);


  /*
  Hitung drop secara otomatis
  berdasarkan posisi bola aktual.
  */

  const dropHeight =
  calculateDrop(
    prizeElement
  );


  statusText.innerHTML =
  "GRABBING";


  cable.style.height =
  dropHeight + "px";


  await wait(800);


  /*
  Tutup claw.
  */

  clawImage.src =
  "assets/claw%20close.png";


  prizeElement.classList.add(
    "winner"
  );


  await wait(350);


  /*
  Tempel hadiah pada claw.
  */

  caughtPrize.src =
  prize.image;


  clawHolder.classList.add(
    "has-prize"
  );


  prizeElement.style.opacity =
  "0";


  await wait(350);


  /*
  Angkat hadiah.
  */

  statusText.innerHTML =
  "MENGANGKAT";


  cable.style.height =
  "42px";


  await wait(900);


  /*
  Tiket.
  */

  ticket--;


  ticketText.innerHTML =
  ticket;


  /*
  Hasil.
  */

  showResult(
    prize
  );


  statusText.innerHTML =
  "BERHASIL";


  message.innerHTML =
  "🎉 Hadiah berhasil didapatkan.";


  document.getElementById(
    "claimButton"
  ).style.display =
  "block";


  playing = false;

}


/* =============================
   RESULT
============================= */

function showResult(
  prize
){

  document.getElementById(
    "resultImage"
  ).src =
  prize.image;


  document.getElementById(
    "resultName"
  ).innerHTML =
  prize.name;


  document.getElementById(
    "resultDesc"
  ).innerHTML =
  prize.description;


  document.getElementById(
    "modal"
  ).style.display =
  "flex";

}


/* =============================
   WAIT
============================= */

function wait(ms){

  return new Promise(
    resolve =>
    setTimeout(
      resolve,
      ms
    )
  );

}


/* =============================
   MODAL
============================= */

document
.getElementById(
  "modal"
)
.addEventListener(
  "click",
  function(e){

    if(
      e.target === this
    ){

      this.style.display =
      "none";

    }

  }
);


/* =============================
   KEYBOARD
============================= */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key ===
      "ArrowLeft"
    ){

      moveLeft();

    }


    if(
      e.key ===
      "ArrowRight"
    ){

      moveRight();

    }


    if(
      e.key ===
      "Enter"
    ){

      grabPrize();

    }

  }
);

</script>

</body>
</html>
